function SigPad({ cvRef, onDraw }) {
  const st = useRef({ on: false, x: 0, y: 0 });
  useEffect(() => { const c = cvRef.current; c.width = 900; c.height = 300; }, []);
  const pt = e => { const r = cvRef.current.getBoundingClientRect(); return [(e.clientX - r.left) * 900 / r.width, (e.clientY - r.top) * 300 / r.height]; };
  const down = e => {
    e.preventDefault(); const c = cvRef.current; try { c.setPointerCapture(e.pointerId); } catch (_) {}
    const [x, y] = pt(e); st.current = { on: true, x, y };
    const g = c.getContext('2d'); g.fillStyle = '#000'; g.beginPath(); g.arc(x, y, 3.5, 0, Math.PI * 2); g.fill();
    onDraw(true);
  };
  const move = e => {
    if (!st.current.on) return; e.preventDefault();
    const g = cvRef.current.getContext('2d'); const [x, y] = pt(e);
    g.strokeStyle = '#000'; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(st.current.x, st.current.y); g.lineTo(x, y); g.stroke(); st.current.x = x; st.current.y = y;
  };
  const up = () => { st.current.on = false; };
  return <canvas ref={cvRef} className="sigpad" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} />;
}

// PDF-Ansicht (pdf.js wird erst auf der Unterschriften-Seite nachgeladen)
const PDFJS_V = '3.11.174';
let pdfjsP = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsP) pdfjsP = new Promise((res, rej) => {
    const base = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/`;
    const t = setTimeout(() => { pdfjsP = null; rej(new Error('Zeitüberschreitung')); }, 12000);
    const sc = document.createElement('script'); sc.src = base + 'pdf.min.js';
    sc.onload = () => { clearTimeout(t); try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(window.pdfjsLib); } catch (e) { pdfjsP = null; rej(e); } };
    sc.onerror = () => { clearTimeout(t); pdfjsP = null; rej(new Error('nicht geladen')); };
    document.head.appendChild(sc);
  });
  return pdfjsP;
}
function PdfPages({ doc, onFail, onTap }) {
  const host = useRef();
  const [ready, setReady] = useState(false);
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        const lib = await loadPdfJs();
        const pdf = await lib.getDocument({ data: new Uint8Array(doc.output('arraybuffer')) }).promise;
        const w = host.current.clientWidth || 360, px = Math.min(2000, w * Math.max(window.devicePixelRatio || 1, 1.5) * 1.3);
        for (let i = 1; i <= pdf.numPages; i++) {
          const pg = await pdf.getPage(i); if (dead) return;
          const v = pg.getViewport({ scale: px / pg.getViewport({ scale: 1 }).width });
          const cv = document.createElement('canvas'); cv.width = Math.floor(v.width); cv.height = Math.floor(v.height);
          await pg.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise; if (dead) return;
          const box = document.createElement('div'); box.className = 'pdfpage'; box.appendChild(cv); host.current.appendChild(box);
          setReady(true);
        }
      } catch (e) { if (!dead) onFail(e); }
    })();
    return () => { dead = true; };
  }, []);
  return (<div className="pdfhost" onClick={onTap} role={onTap ? 'button' : undefined} aria-label={onTap ? 'Zum Unterschreiben tippen' : undefined}>
    {!ready && <p className="empty" style={{ textAlign: 'center' }}>Lade Ansicht …</p>}
    <div ref={host} />
  </div>);
}

// Handy-Ansicht: Abrechnung als PDF ansehen, unterschreiben, teilen / automatisch zurücksenden
function SignApp() {
  const [st, setSt] = useState({ phase: 'load' });
  useEffect(() => { (async () => {
    try {
      const p = await unpackPayload(decodeURIComponent(location.hash.slice(3)));
      if (!p || p.v !== 1 || !PROFILES[p.p] || !p.i) throw new Error('Der Link ist ungültig oder unvollständig.');
      setSt({ phase: 'sign', p, code: await pruefcode(p) });
    } catch (e) { setSt({ phase: 'error', msg: e.message || 'Der Link konnte nicht gelesen werden.' }); }
  })(); }, []);
  if (st.phase === 'load') return <div className="signwrap"><p className="empty">Lade Abrechnung …</p></div>;
  if (st.phase === 'error') return (<div className="signwrap"><h1>Provisionsabrechnung</h1><p className="err">{st.msg}</p><p className="empty">Bitte den QR-Code erneut scannen oder beim Vorgesetzten einen neuen Code anfordern.</p></div>);
  CUR = PROFILES[st.p.p];
  return <SignView p={st.p} code={st.code} />;
}

function SignView({ p, code }) {
  const R = { ...CUR.core.DEFAULT_RULES, ...(p.r || {}) };
  const inp = { ...CUR.BLANK, ...p.i };
  const res = calc(inp, R);
  const pdfFor = extra => buildPdf(window.jspdf.jsPDF, { ...inp, datum: heute(), ...extra }, R);
  const plain = useMemo(() => pdfFor({}), []);
  const [done, setDone] = useState(null);
  const [open, setOpen] = useState(false);
  const [ok, setOk] = useState(false);
  const [has, setHas] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [fail, setFail] = useState(false);
  const cvRef = useRef();
  const clearSig = () => { cvRef.current.getContext('2d').clearRect(0, 0, 900, 300); setHas(false); };
  async function sign() {
    setBusy(true); setMsg('');
    try {
      const now = new Date();
      const note = `Digital unterschrieben am ${now.toLocaleDateString('de-DE')} um ${now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr · Prüfcode ${code}`;
      const sc = document.createElement('canvas'); sc.width = 450; sc.height = 150;
      sc.getContext('2d').drawImage(cvRef.current, 0, 0, 450, 150);
      const img = sc.toDataURL('image/png');
      // Die Unterschrift erscheint auf Seite 1 (Auszahlungsbetrag) und Seite 2 (Arbeitnehmer)
      const doc = pdfFor({ signImg: img, signNote: note });
      // Unterschrift zusätzlich als Metadaten im PDF: Das Dashboard liest sie daraus wieder ein
      const sigMeta = { v: 1, f: p.p, s: inp.name, m: inp.monat, j: inp.jahr, c: code, t: res.total, a: now.toISOString(), d: heute(), i: img, n: note };
      doc.setProperties({ keywords: 'HETECSIG:' + b64uEnc(new TextEncoder().encode(JSON.stringify(sigMeta))) });
      const q = p.q, viaRelay = !!(q && q.i && q.k && q.t && REPO_RE.test(q.r || ''));
      setDone({ doc, up: viaRelay ? 'sending' : 'none', blob: doc.output('blob'), name: fname(inp, 'pdf').replace(/\.pdf$/, '_unterschrieben.pdf') });
      setOpen(false); try { window.scrollTo(0, 0); } catch (_) {}
      if (viaRelay) {
        try { await relayPut(q, sigMeta); setDone(d => ({ ...d, up: 'ok' })); }
        catch (e) { setDone(d => ({ ...d, up: e.message === 'schon übermittelt' ? 'ok' : 'err' })); }
      }
    } catch (e) { setMsg('Fehler beim Erstellen: ' + e.message); }
    setBusy(false);
  }
  const save = () => download(done.blob, done.name);
  async function share() {
    const f = new File([done.blob], done.name, { type: 'application/pdf' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: done.name, text: `Provisionsabrechnung ${inp.monat} ${inp.jahr}, unterschrieben${p.t ? ' – bitte an ' + p.t : ''}` }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    save();
  }
  const openPlain = () => { try { window.open(plain.output('bloburl'), '_blank'); } catch (e) { setMsg('PDF-Vorschau nicht möglich: ' + e.message); } };
  return (
    <div className="pdfview">
      <div className="pv-top"><strong>{inp.vollerName || inp.name}</strong><span>Provision {inp.monat} {inp.jahr}</span></div>
      {done ? (
        <div className={'pv-banner ' + (done.up === 'err' ? 'warn' : 'ok')}>
          <b>Unterschrieben ✓</b>
          {done.up === 'ok' ? ' Deine Unterschrift wurde übermittelt. Du musst nichts weiter tun.'
            : done.up === 'sending' ? ' Übermittle Unterschrift …'
            : <>{done.up === 'err' ? ' Die automatische Übermittlung hat nicht geklappt.' : ''} Bitte jetzt über „Teilen“ zurücksenden{p.t ? <> an <b>{p.t}</b></> : ''}.</>}
        </div>
      ) : <div className="pv-hint">Abrechnung und Zusatzvereinbarung prüfen. Zum Unterschreiben auf das Dokument oder unten auf den Knopf tippen.</div>}
      {fail ? (<div className="signwrap">
        <Sheet inp={inp} res={res} R={R} />
        {!done && <button className="ghost full" onClick={openPlain}>Abrechnung und Zusatzvereinbarung als PDF ansehen</button>}
      </div>) : <PdfPages key={done ? 's' : 'u'} doc={done ? done.doc : plain} onFail={() => setFail(true)} onTap={done ? undefined : () => setOpen(true)} />}
      {msg && !open && <p className="err" style={{ margin: '0 16px' }}>{msg}</p>}
      <p className="empty" style={{ textAlign: 'center', fontSize: '.8rem' }}>Prüfcode {code}</p>
      <div className="pv-bar"><div>
        {done ? <>
          <button className="primary" onClick={share}>Teilen</button>
          <button className="ghost" onClick={save}>PDF speichern</button>
        </> : <button className="primary" onClick={() => setOpen(true)}>Unterschreiben</button>}
      </div></div>
      {open && !done && (
        <div className="pv-sheetbg" onClick={e => { if (e.target === e.currentTarget && !busy) setOpen(false); }}>
          <div className="pv-sheet" role="dialog" aria-label="Unterschreiben">
            <label className="check signcheck"><input type="checkbox" checked={ok} onChange={e => setOk(e.target.checked)} /> Ich habe die Abrechnung und die Zusatzvereinbarung gelesen und bin einverstanden.</label>
            <div className="sigarea"><span>Hier unterschreiben</span><SigPad cvRef={cvRef} onDraw={setHas} /></div>
            <p className="empty" style={{ margin: '8px 0 0', fontSize: '.82rem' }}>Die Unterschrift wird auf Seite 1 und Seite 2 eingesetzt.</p>
            {msg && <p className="err">{msg}</p>}
            <div className="pv-sheetbtns">
              <button className="ghost" onClick={clearSig} disabled={busy}>Löschen</button>
              <button className="ghost" onClick={() => setOpen(false)} disabled={busy}>Abbrechen</button>
              <button className="primary" onClick={sign} disabled={!ok || !has || busy}>{busy ? 'Erstelle PDF …' : 'Unterschreiben'}</button>
            </div>
          </div>
        </div>)}
    </div>
  );
}

function App() {
  const [R, setR] = useState(() => { const s = load(pk('rules'), {}); return s && s._v === CUR.core.RULES_VERSION ? { ...CUR.core.DEFAULT_RULES, ...s } : { ...CUR.core.DEFAULT_RULES, _v: CUR.core.RULES_VERSION }; });
  const [data, setData] = useState(() => load(pk('data'), null));
  const [meta, setMeta] = useState(() => load(pk('meta'), { monat: '', jahr: String(new Date().getFullYear()), ort: '', datum: heute() }));
  const [ov, setOv] = useState(() => load(pk('ov'), {}));
  const [slSet, setSlSet] = useState(() => load(pk('sl'), CUR.SL_DEFAULTS));
  const [tzSet, setTzSet] = useState(() => load(pk('tz'), {}));
  const [esSet, setEsSet] = useState(() => load(pk('es'), {})); // je Monat|Mitarbeiter: alle 5 Qualitätsziele erreicht
  const [manual, setManual] = useState(() => load(pk('manual'), { ...CUR.BLANK, name: '', vollerName: '' }));
  const [edit, setEdit] = useState(null); // sheet-Name | '__manual'
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState('');
  const [drag, setDrag] = useState(false);
  const fileRef = useRef();
  const telRef = useRef();
  const dneRef = useRef();
  const bakRef = useRef(), sigRef = useRef();
  useEffect(() => save(pk('rules'), R), [R]);
  useEffect(() => save(pk('data'), data), [data]);
  useEffect(() => save(pk('meta'), meta), [meta]);
  useEffect(() => save(pk('ov'), ov), [ov]);
  useEffect(() => save(pk('sl'), slSet), [slSet]);
  useEffect(() => save(pk('tz'), tzSet), [tzSet]);
  useEffect(() => save(pk('es'), esSet), [esSet]);
  useEffect(() => save(pk('manual'), manual), [manual]);

  // Beim ersten Öffnen in einem neuen Kalendermonat automatisch auf den aktuellen Monat wechseln.
  // Die bisherigen Monatsdaten und Versandnachweise bleiben in ihren eigenen Monatsschlüsseln erhalten.
  useEffect(() => {
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const handled = load(pk('autoMonth'), '');
    if (handled !== monthKey) {
      setMeta(m => ({ ...m, monat: MONATE[now.getMonth()], jahr: String(now.getFullYear()), datum: heute() }));
      save(pk('autoMonth'), monthKey);
    }
  }, []);

  const refreshMonth = () => {
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    setMeta(m => ({ ...m, monat: MONATE[now.getMonth()], jahr: String(now.getFullYear()), datum: heute() }));
    save(pk('autoMonth'), monthKey);
    setEdit(null);
    setMailDlg(null);
    setMsg(`Abrechnungsmonat auf ${MONATE[now.getMonth()]} ${now.getFullYear()} gestellt. Alte Monatsdaten und Versandnachweise bleiben erhalten. ${data?.months?.includes(MONATE[now.getMonth()]) ? 'Die Monatswerte sind vorhanden.' : 'Bitte jetzt die neue Performance-Excel für diesen Monat einlesen.'}`);
  };

  const key = sheet => `${meta.jahr}|${meta.monat}|${sheet}`;
  const shared = { monat: meta.monat, jahr: meta.jahr, ort: meta.ort, datum: meta.datum };

  const list = useMemo(() => {
    if (!data || !meta.monat) return [];
    return data.employees.filter(e => e.rows[meta.monat]).map(e => {
      const row = e.rows[meta.monat];
      const o = ov[key(e.sheet)] || {};
      const tel = data.telefonie ? matchTelefonie(e.fullName, data.telefonie.list) : null;
      const dne = data.dne ? matchDne(e.fullName, e.sheet, data.dne.list) : null;
      const base = { ...CUR.BLANK, ...row.inp, ...(tel ? { [CUR.telField]: tel.tel } : {}), ...(dne ? { werb: dne.werb } : {}) };
      const sl = slSet[e.sheet] || {};
      const inp = { ...base, name: e.sheet, vollerName: e.fullName, ...shared, ...(o.fields || {}),
        teilzeit: !!tzSet[e.sheet], einstiegsfrei: !!esSet[key(e.sheet)], shopleiter: !!sl.on, slRate1: sl.r1 ?? '', slRate2: sl.r2 ?? '', slZiel: (o.fields || {}).slZiel ?? sl.ziel ?? '', slIst: (o.fields || {}).slIst ?? '' };
      const include = o.include ?? row.active;
      const todo = CUR.todo(inp, row, data);
      if (inp.shopleiter && !(Number(inp.slZiel) > 0)) todo.push({ t: 'Shopleiter: Margenziel fehlt' });
      if (inp.shopleiter && inp.slIst === '') todo.push({ t: 'Shopleiter: Marge-Ist fehlt' });
      const res0 = calc(inp, R);
      // Digitale Unterschrift nur ins PDF, solange sich der Auszahlungsbetrag seit der Unterschrift nicht geändert hat
      const sigChanged = !!(o.sig && Math.abs((o.sig.total ?? res0.total) - res0.total) > 0.004);
      if (o.sig && !sigChanged) { inp.signImg = o.sig.img; inp.signNote = o.sig.note; if (o.sig.datum) inp.datum = o.sig.datum; }
      const credited = id => { const qx = res0.qual.find(q => q.row === id); const k = res0.korr.find(c => c.key === id); return !!(qx && k && qx.betrag < 0 && k.betrag >= -qx.betrag); };
      const todoF = todo.filter(t => !(t.k && credited(t.k))).map(t => t.t);
      const sent = o.sent || null;
      return { e, row, inp, include, todo: todoF, tel, credited, sent, sig: o.sig || null, sigChanged, sentChanged: !!(sent && Math.abs((sent.total || 0) - res0.total) > 0.004), edited: !!(o.fields && Object.keys(o.fields).some(k => !['sonderBetrag', 'sonderText', 'slZiel', 'slIst', 'notiz'].includes(k))), res: res0 };
    });
  }, [data, meta, ov, R, slSet, tzSet, esSet]);
  const chosen = list.filter(x => x.include);
  const sum = chosen.reduce((s, x) => s + x.res.total, 0);

  const patchSl = (sheet, p) => {
    const s = {}; const month = {};
    if ('teilzeit' in p) setTzSet(x => ({ ...x, [sheet]: !!p.teilzeit }));
    if ('einstiegsfrei' in p) setEsSet(x => ({ ...x, [key(sheet)]: !!p.einstiegsfrei }));
    if ('shopleiter' in p) s.on = p.shopleiter;
    if ('slRate1' in p) s.r1 = p.slRate1;
    if ('slRate2' in p) s.r2 = p.slRate2;
    if ('slZiel' in p) { s.ziel = p.slZiel; month.slZiel = p.slZiel; }
    if ('slIst' in p) month.slIst = p.slIst;
    if (Object.keys(s).length) setSlSet(x => ({ ...x, [sheet]: { r1: '5', r2: '10', ...(x[sheet] || {}), ...s } }));
    const rest = Object.fromEntries(Object.entries(p).filter(([k]) => !['teilzeit', 'einstiegsfrei', 'shopleiter', 'slRate1', 'slRate2'].includes(k)));
    if (Object.keys(rest).length) patch(sheet, { fields: rest });
  };
  const setEsAll = v => setEsSet(x => { const n = { ...x }; list.forEach(l => { n[key(l.e.sheet)] = v; }); return n; });
  const patch = (sheet, p) => setOv(s => { const k = key(sheet); const cur = s[k] || {}; return { ...s, [k]: { ...cur, ...('include' in p ? { include: p.include } : {}), ...('sent' in p ? { sent: p.sent } : {}), ...('sig' in p ? { sig: p.sig } : {}), fields: { ...(cur.fields || {}), ...(p.fields || {}) } } }; });
  const [mailDlg, setMailDlg] = useState(null);
  const [signDlg, setSignDlg] = useState(null);
  const [more, setMore] = useState({});
  const [sigReq, setSigReq] = useState(() => load(pk('sigReq'), {}));
  const [relay, setRelay] = useState(loadRelay);
  const relayRef = useRef(relay);
  const sigReqRef = useRef(sigReq);
  useEffect(() => { relayRef.current = relay; }, [relay]);
  const saveRelay = r => { try { localStorage.setItem('provi_relay', JSON.stringify(r)); } catch (e) {} relayRef.current = r; setRelay(r); };
  useEffect(() => { sigReqRef.current = sigReq; save(pk('sigReq'), sigReq); }, [sigReq]);
  const openSign = sheet => {
    const k = key(sheet);
    if (relayRef.current && !sigReqRef.current[k]) { const rq = { id: rnd(16), k: rnd(16), at: new Date().toISOString() }; sigReqRef.current = { ...sigReqRef.current, [k]: rq }; setSigReq(m => ({ ...m, [k]: rq })); }
    setSignDlg(sheet);
  };
  async function pollSigs(manual) {
    const rl = relayRef.current; if (!rl) return;
    let n = 0;
    for (const [k, rq] of Object.entries(sigReqRef.current)) {
      try {
        const got = await relayGet(rl, rq);
        if (!got) continue;
        const s = got.s;
        if (s.v !== 1 || `${s.j}|${s.m}|${s.s}` !== k || typeof s.i !== 'string' || !/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(s.i)) continue;
        setOv(o => ({ ...o, [k]: { ...(o[k] || {}), sig: { img: s.i, note: s.n, code: s.c, total: s.t, datum: s.d, at: s.a || new Date().toISOString() } } }));
        sigReqRef.current = Object.fromEntries(Object.entries(sigReqRef.current).filter(([x]) => x !== k));
        setSigReq(sigReqRef.current);
        relayDel(rl, rq, got.sha).catch(() => {});
        n++;
        setMsg(`Unterschrift angekommen: ${s.s}.`);
      } catch (e) {}
    }
    if (!n && manual) setMsg('Noch keine neue Unterschrift eingegangen.');
  }
  useEffect(() => {
    const f = () => { if (!document.hidden && relayRef.current && Object.keys(sigReqRef.current).length) pollSigs(); };
    f(); const t = setInterval(f, 15000); window.addEventListener('focus', f);
    return () => { clearInterval(t); window.removeEventListener('focus', f); };
  }, []);
  const [mailSet, setMailSet] = useState(() => load(pk('mail'), {}));
  useEffect(() => save(pk('mail'), mailSet), [mailSet]);

  // Historie (lokal): je Jahr|Monat|Mitarbeiter ein Eintrag mit der Auszahlung
  const [hist, setHist] = useState(() => load(pk('hist'), {}));
  const [showHist, setShowHist] = useState(false);
  const [showPrev, setShowPrev] = useState(false);
  useEffect(() => save(pk('hist'), hist), [hist]);
  // Einmalig: bereits versendete Abrechnungen aus den Versandnachweisen übernehmen
  useEffect(() => { setHist(h => histFromSent(ov, data ? data.employees : [], h)); }, []);
  // Verschlüsselte Start-Historie: einmal Passwort eingeben, danach liegt alles lokal im Browser
  const [seedBox, setSeedBox] = useState(null);
  const [seedPw, setSeedPw] = useState('');
  useEffect(() => {
    if (load(pk('seedDone'), false)) return;
    fetch('historie-seed.enc.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.ct) setSeedBox(j); }).catch(() => {});
  }, []);
  async function unlockSeed() {
    try {
      const plain = await decryptSeed(seedBox, seedPw);
      let total = 0;
      Object.keys(PROFILES).forEach(id => {
        const src = plain[id] && plain[id].hist; if (!src) return;
        if (id === CUR.id) { const r = mergeHist(hist, src); setHist(r.out); total += r.n; }
        else {
          const k = PROFILES[id].prefix + '_hist'; let cur = {};
          try { cur = JSON.parse(localStorage.getItem(k)) || {}; } catch (e) {}
          const r = mergeHist(cur, src); total += r.n;
          try { localStorage.setItem(k, JSON.stringify(r.out)); } catch (e) {}
        }
        try { localStorage.setItem(PROFILES[id].prefix + '_seedDone', 'true'); } catch (e) {}
      });
      setSeedBox(null); setSeedPw('');
      setMsg(`Historie freigeschaltet: ${total} Einträge übernommen (o2 Shops und Fachhandel). Sie liegt jetzt nur lokal in diesem Browser.`);
    } catch (e) { setMsg('Passwort falsch oder Datei beschädigt.'); }
  }
  const recordMonth = xs => {
    if (!xs.length || !meta.monat) return;
    const at = new Date().toISOString(), jahr = String(meta.jahr), monat = meta.monat;
    setHist(h => { const n = { ...h }; xs.forEach(x => { const nm = x.inp.vollerName || x.e.sheet, sh = canonSheet(n, nm, x.e.sheet); n[histKey(jahr, monat, sh)] = { jahr, monat, sheet: sh, name: nm, total: x.res.total, brutto: x.res.brutto, sonder: x.res.sonder.betrag, at, src: 'Abrechnung' }; }); return n; });
  };

  async function readFile(file) {
    setMsg(''); setBusy('import');
    try {
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(await file.arrayBuffer());
      const d = CUR.core.parsePerformance(wb);
      if (!d.employees.length) throw new Error('Keine Mitarbeiterblätter mit Spalte „PO gesamt“ gefunden.');
      setData(old => ({ ...d, telefonie: old?.telefonie, dne: old?.dne, file: file.name, loaded: new Date().toISOString() }));
      setMeta(m => ({ ...m, monat: d.months.includes(m.monat) ? m.monat : (d.months[d.months.length - 1] || MONATE[0]) }));
      setMsg(`${d.employees.length} Mitarbeiter aus „${file.name}“ eingelesen.`);
    } catch (e) { setMsg('Datei konnte nicht gelesen werden: ' + e.message); }
    setBusy('');
  }

  async function readTel(file) {
    setMsg(''); setBusy('tel');
    try {
      const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
      const list = parseTelefonie(wb);
      if (!list.length) throw new Error('Keine Zeilen mit Name (Spalte A) und Telefonie (Spalte B) gefunden.');
      setData(d => ({ ...(d || { employees: [], months: [] }), telefonie: { file: file.name, list } }));
      setMsg(`Telefoniewerte für ${list.length} Personen aus „${file.name}“ eingelesen.`);
    } catch (e) { setMsg('Telefonie-Datei konnte nicht gelesen werden: ' + e.message); }
    setBusy('');
  }

  async function readDne(file) {
    setMsg(''); setBusy('dne');
    try {
      const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
      const list = parseDne(wb);
      if (!list.length) throw new Error('Keine Zeilen mit Name (Spalte A) und DNE-Prozent (Spalte D) gefunden.');
      setData(d => ({ ...(d || { employees: [], months: [] }), dne: { file: file.name, list } }));
      const emps = data ? data.employees : [];
      const miss = emps.filter(e => !matchDne(e.fullName, e.sheet, list)).map(e => e.fullName);
      setMsg(`DNE-Werte für ${list.length} Personen aus „${file.name}“ eingelesen.` + (emps.length ? (miss.length ? ` Nicht zugeordnet: ${miss.join(', ')}.` : ' Alle Mitarbeiter zugeordnet.') : ''));
    } catch (e) { setMsg('DNE-Datei konnte nicht gelesen werden: ' + e.message); }
    setBusy('');
  }
  async function oneXlsx(inp) { setBusy('xlsx'); try { const { buffer } = await buildXlsx(ExcelJS, null, inp, R); download(new Blob([buffer], { type: XLSX_MIME }), fname(inp, 'xlsx')); } catch (e) { setMsg('Excel-Fehler: ' + e.message); } setBusy(''); }
  function onePdf(inp) { setBusy('pdf'); try { buildPdf(window.jspdf.jsPDF, inp, R).save(fname(inp, 'pdf')); } catch (e) { setMsg('PDF-Fehler: ' + e.message); } setBusy(''); }

  async function buildZip() {
      const zip = new JSZip();
      zip.file(backupName(), JSON.stringify(backupObj(), null, 1));
      for (const x of chosen) {
        zip.file('PDF/' + fname(x.inp, 'pdf'), buildPdf(window.jspdf.jsPDF, x.inp, R).output('arraybuffer'));
        const { buffer } = await buildXlsx(ExcelJS, null, x.inp, R);
        zip.file('Excel/' + fname(x.inp, 'xlsx'), buffer);
      }
      // Übersicht
      const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Übersicht');
      ws.columns = [{ header: 'Mitarbeiter', width: 28 }, { header: 'Blatt', width: 16 }, { header: 'Bereich', width: 12 }, { header: '', width: 2 }, { header: '', width: 2 }, { header: '', width: 2 }, { header: 'Summe Provision', width: 16 }, { header: 'Shopleiter-Provision', width: 18 }, { header: 'Abzüge Qualität', width: 16 }, { header: 'Sonderprovision', width: 16 }, { header: 'Anlass', width: 36 }, { header: 'Auszahlung', width: 14 }, { header: 'Hinweis', width: 60 }];
      chosen.forEach(x => ws.addRow([x.inp.vollerName, x.e.sheet, CUR.title, '', '', '', x.res.summe, x.res.sl ? x.res.sl.betrag : 0, x.res.qual.reduce((s, q) => s + q.betrag, 0), x.res.sonder.betrag, x.res.sonder.text, x.res.total, x.todo.length ? 'Handlungsbedarf: ' + x.todo.join(', ') : '']));
      chosen.forEach((x, k) => { if (x.todo.length) ws.getRow(k + 2).eachCell({ includeEmpty: true }, c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFE0E0' } }; }); });
      const last = chosen.length + 1;
      ws.addRow(['Gesamt', '', '', '', '', '', ...['G', 'H', 'I', 'J'].map(c => ({ formula: `SUM(${c}2:${c}${last})` })), '', { formula: `SUM(L2:L${last})` }]);
      ws.getRow(1).font = { bold: true, name: 'Arial' }; ws.getRow(last + 1).font = { bold: true, name: 'Arial' };
      ['G', 'H', 'I', 'J', 'L'].forEach(c => ws.getColumn(c).numFmt = '#,##0.00 "€"');
      zip.file(`Uebersicht_${safe(meta.monat)}_${meta.jahr}.xlsx`, await wb.xlsx.writeBuffer());
      return zip.generateAsync({ type: 'uint8array' });
  }
  const backupObj = () => ({ app: 'hetec-provisionsabrechnung', profil: CUR.id, version: 1, erstellt: new Date().toISOString(), data, meta, ov, slSet, tzSet, esSet, mailSet, R, manual, hist });
  const backupName = () => `Sicherung_Provision_${CUR.id}_${safe(meta.monat)}_${meta.jahr}_${new Date().toISOString().slice(0, 10)}.json`;
  function saveBackup() {
    download(new Blob([JSON.stringify(backupObj(), null, 1)], { type: 'application/json' }), backupName());
    setMsg('Sicherung gespeichert. Mit „Sicherung laden“ stellst du später alles wieder her, auch auf einem anderen Gerät.');
  }
  async function loadBackup(file) {
    try {
      const b = JSON.parse(await file.text());
      if (b.app !== 'hetec-provisionsabrechnung') throw new Error('Keine Sicherung dieser App.');
      if ((b.profil || 'o2') !== CUR.id) throw new Error(`Diese Sicherung gehört zum Bereich „${(b.profil || 'o2') === 'fh' ? 'Fachhandel' : 'o2 Shops'}“. Bitte oben umschalten.`);
      if (!confirm(`Sicherung vom ${new Date(b.erstellt).toLocaleString('de-DE')} (${b.meta?.monat || ''} ${b.meta?.jahr || ''}) laden? Der aktuelle Stand wird ersetzt.`)) return;
      if (b.data !== undefined) setData(b.data);
      if (b.meta) setMeta(b.meta);
      if (b.ov) setOv(b.ov);
      if (b.slSet) setSlSet(b.slSet);
      if (b.tzSet) setTzSet(b.tzSet);
      if (b.esSet) setEsSet(b.esSet);
      if (b.mailSet) setMailSet(b.mailSet);
      if (b.R) setR({ ...CUR.core.DEFAULT_RULES, ...b.R });
      if (b.manual) setManual(b.manual);
      setHist(h => histFromSent(b.ov || {}, b.data ? b.data.employees : [], b.hist ? { ...b.hist } : h));
      setEdit(null);
      setMsg(`Sicherung „${file.name}“ geladen.`);
    } catch (e) { setMsg('Sicherung konnte nicht geladen werden: ' + e.message); }
  }
  async function importSigs(files) {
    let n = 0; const bad = [];
    for (const f of files) {
      try {
        const s = await parseSigPdf(f);
        if (s.f && s.f !== CUR.id) { bad.push(`${f.name}: gehört zu „${s.f === 'fh' ? 'Fachhandel' : 'o2 Shops'}“, bitte oben umschalten`); continue; }
        const k = `${s.j}|${s.m}|${s.s}`;
        setOv(o => ({ ...o, [k]: { ...(o[k] || {}), sig: { img: s.i, note: s.n, code: s.c, total: s.t, datum: s.d, at: s.a || new Date().toISOString() } } }));
        n++;
      } catch (e) { bad.push(`${f.name}: ${e.message}`); }
    }
    setMsg((n ? `${n} Unterschrift${n === 1 ? '' : 'en'} eingelesen. Der PDF-Button enthält sie jetzt.` : '') + (bad.length ? (n ? ' ' : '') + 'Nicht übernommen: ' + bad.join('; ') + '.' : ''));
  }
  const zipName = () => `Provisionen_${safe(meta.monat)}_${meta.jahr}.zip`;

  async function generateAll() {
    if (!chosen.length) return;
    setBusy('zip'); setMsg('');
    try {
      download(new Blob([await buildZip()], { type: 'application/zip' }), zipName());
      recordMonth(chosen);
      setMsg(`${chosen.length} Abrechnungen erstellt und in der Historie gespeichert.`);
    } catch (e) { setMsg('Fehler beim Erstellen: ' + e.message); }
    setBusy('');
  }

  function mailText() {
    const lines = chosen.map(x => `${x.inp.vollerName || x.e.sheet}: ${eur(x.res.total)}`);
    const sum = chosen.reduce((s, x) => s + x.res.total, 0);
    return `Hallo,\n\nanbei die Provisionen für ${meta.monat} ${meta.jahr}.\n\n${lines.join('\n')}\n\nGesamt: ${eur(sum)} (${chosen.length} Mitarbeiter)\n\nDie Abrechnungen (PDF und Excel) sowie die Übersicht liegen als ZIP im Anhang.\n\nViele Grüße`;
  }

  async function sendMail() {
    if (!chosen.length) return;
    setBusy('mail'); setMsg('');
    try {
      const zipBytes = await buildZip();
      const subject = `Provisionen ${meta.monat} ${meta.jahr}`;
      const text = mailText();
      const sumAll = chosen.reduce((s, x) => s + x.res.total, 0);
      const td = 'padding:6px 12px;border:1px solid #BFC6D1;font-family:Calibri,Arial,sans-serif;font-size:11pt;';
      const th = td + 'background:#0A1F44;color:#ffffff;font-weight:bold;text-align:left;';
      const html = `<html><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000">
<p>Hallo,</p><p>anbei die Provisionen für ${escH(meta.monat)} ${escH(meta.jahr)}.</p>
<table cellspacing="0" cellpadding="0" style="border-collapse:collapse">
<tr><th style="${th}">Vorname</th><th style="${th}">Nachname</th><th style="${th}text-align:right">Provision</th></tr>
${chosen.map((x, k) => { const nm = String(x.inp.vollerName || x.e.sheet).trim().split(/\s+/); const vn = nm.length > 1 ? nm[0] : ''; const nn = nm.length > 1 ? nm.slice(1).join(' ') : nm[0];
  const bg = k % 2 ? 'background:#F2F4F8;' : ''; return `<tr><td style="${td}${bg}">${escH(vn)}</td><td style="${td}${bg}">${escH(nn)}</td><td style="${td}${bg}text-align:right">${escH(eur(x.res.total))}</td></tr>`; }).join('\n')}
<tr><td colspan="2" style="${td}font-weight:bold;background:#E8EEFF">Gesamt (${chosen.length} Mitarbeiter)</td><td style="${td}font-weight:bold;text-align:right;background:#E8EEFF">${escH(eur(sumAll))}</td></tr>
</table>
<p>Die Abrechnungen (PDF und Excel) sowie die Übersicht liegen als ZIP im Anhang.</p><p>Viele Grüße</p><\/body><\/html>`;
      const eml = makeEml({ to: meta.mailTo || '', subject, text, html, files: [{ name: zipName(), mime: 'application/zip', bytes: zipBytes }] });
      download(new Blob([eml], { type: 'message/rfc822' }), `Provisionen_${safe(meta.monat)}_${meta.jahr}.eml`);
      try { await navigator.clipboard.writeText(text); } catch (e) {}
      recordMonth(chosen);
      setMsg('E-Mail-Entwurf heruntergeladen: Datei öffnen, sie erscheint in Outlook mit ZIP im Anhang. Der Text ist zusätzlich in der Zwischenablage. Monat in der Historie gespeichert.');
    } catch (e) { setMsg('E-Mail konnte nicht erstellt werden: ' + e.message); }
    setBusy('');
  }

  // Editor-Ansicht
  if (edit) {
    if (edit === '__manual') {
      const inp = { ...manual, ...shared, ...(manual.monatOwn ? { monat: manual.monat } : {}) };
      return (<div className="wrap"><Header />
        <Editor inp={inp} R={R} busy={busy} onBack={() => setEdit(null)} onPatch={p => setManual(m => ({ ...m, ...p }))} onReset={() => {}}
          onXlsx={() => oneXlsx(inp)} onPdf={() => onePdf(inp)} imported={false} /></div>);
    }
    const x = list.find(l => l.e.sheet === edit);
    if (x) return (<div className="wrap"><Header />
      <Editor inp={x.inp} R={R} busy={busy} imported onBack={() => setEdit(null)}
        onPatch={p => patchSl(edit, p)}
        onReset={() => setOv(s => { const k = key(edit); const f = s[k]?.fields || {}; return { ...s, [k]: { ...s[k], fields: { sonderBetrag: f.sonderBetrag, sonderText: f.sonderText, slZiel: f.slZiel, slIst: f.slIst } } }; })}
        onXlsx={() => oneXlsx(x.inp)} onPdf={() => onePdf(x.inp)} /></div>);
  }

  if (showPrev) return (<Vorschau data={data} R={R} hist={hist} tzSet={tzSet} slSet={slSet} esSet={esSet} onBack={() => setShowPrev(false)} />);

  if (showHist) return (<div className="wrap"><Header /><Historie hist={hist} setHist={setHist} title={CUR.title} profil={CUR.id} defJahr={meta.jahr} onBack={() => setShowHist(false)} /></div>);

  const closeMenu = e => { const d = e.currentTarget.closest('details'); if (d) d.open = false; };
  const metaFields = (
    <div className="tbfields">
      <label>Monat <select aria-label="Abrechnungsmonat" value={meta.monat} onChange={e => setMeta(m => ({ ...m, monat: e.target.value }))}>
        <option value="" disabled>Monat wählen</option>
        {MONATE.map(m => <option key={m} value={m}>{m}{data && !data.months.includes(m) ? ' (keine Daten)' : ''}</option>)}
      </select></label>
      <label>Jahr <input className="w-y" inputMode="numeric" aria-label="Jahr" value={meta.jahr} onChange={e => setMeta(m => ({ ...m, jahr: e.target.value }))} /></label>
      <label>Ort <input className="w-o" aria-label="Ort (Vereinbarung)" placeholder="Ort" value={meta.ort} onChange={e => setMeta(m => ({ ...m, ort: e.target.value }))} /></label>
      <label>Datum <input className="w-d" aria-label="Datum" value={meta.datum} onChange={e => setMeta(m => ({ ...m, datum: e.target.value }))} /></label>
      {CUR.features.einstieg && list.length > 0 && <details className="menu"><summary className="btn-s">Alle: Einstiegsschwelle ▾</summary><div className="pop">
        <button onClick={e => { closeMenu(e); setEsAll(true); }} title="Bei allen Mitarbeitern keine Einstiegsschwelle">Bei allen: keine Einstiegsschwelle</button>
        <button onClick={e => { closeMenu(e); setEsAll(false); }} title="Bei allen Mitarbeitern gilt die Einstiegsschwelle">Bei allen: Einstiegsschwelle gilt</button>
      </div></details>}
    </div>);

  return (
    <div className="wrap">
      <div className="topbar">
        <h1>Provisionsabrechnung <span className="mode">{CUR.title}</span></h1>
        <div className="topbtns">
          <button className="btn-s" onClick={refreshMonth} title="Stellt den aktuellen Kalendermonat ein, ohne frühere Abrechnungen oder Versandnachweise zu löschen">↻ Monat aktualisieren</button>
          <button className="btn-s" onClick={() => setShowPrev(true)} title="Hochrechnung der Provision aus dem aktuellen Zwischenstand">Vorschau</button>
          <button className="btn-s" onClick={() => setShowHist(true)} title="Alle Provisionen je Mitarbeiter und Monat mit Durchschnitten">Historie</button>
          <button className="btn-s" onClick={() => sigRef.current.click()} title="Unterschriebene PDFs vom Handy einlesen (mehrere möglich)">Unterschriften einlesen</button>
          <input ref={sigRef} type="file" accept=".pdf,application/pdf" multiple hidden onChange={e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importSigs(fs); }} />
          <details className="menu"><summary className="btn-s">Sicherung ▾</summary><div className="pop">
            <button onClick={e => { closeMenu(e); saveBackup(); }} disabled={!data} title="Alle Werte, Kulanzen, Begründungen und Notizen">Sicherung speichern</button>
            <button onClick={e => { closeMenu(e); bakRef.current.click(); }}>Sicherung laden</button>
          </div></details>
          <input ref={bakRef} type="file" accept=".json,application/json" hidden onChange={e => { const f = e.target.files[0]; if (f) loadBackup(f); e.target.value = ''; }} />
        </div>
      </div>
      <div className="chips">
        <FileChip label="Performance-Excel" loaded={!!data} busy={busy === 'import'} onFile={readFile}
          info={data ? `${data.employees.length} Mitarbeiter · ${data.file}` : 'Monatsdatei ablegen oder klicken'} title={data ? data.file : 'Performance-Excel einlesen'} />
        <FileChip label="Telefonie (WOBIS)" loaded={!!data?.telefonie} busy={busy === 'tel'} onFile={readTel}
          info={data?.telefonie ? `${data.telefonie.list.length} Personen` : 'ablegen oder klicken'} title={data?.telefonie ? data.telefonie.file : 'Spalte A Name, Spalte B Telefonie – ersetzt den Marketingwert'} />
        <FileChip label="DNE (Werbeversprechen)" loaded={!!data?.dne} busy={busy === 'dne'} onFile={readDne}
          info={data?.dne ? `${data.dne.list.length} Personen` : 'ablegen oder klicken'} title={data?.dne ? data.dne.file : 'Spalte A „Nachname Vorname“, Spalte D DNE % – ersetzt den Werbeversprechen-Wert'} />
      </div>
      {msg && <p className="msg">{msg}</p>}
      {seedBox && (
        <div className="card special">
          <h2>Historie freischalten</h2>
          <p className="empty" style={{ margin: '0 0 12px' }}>Die bisherigen Monate liegen verschlüsselt bereit. Passwort einmal eingeben, danach liegt die Historie nur lokal in diesem Browser.</p>
          <div className="histform">
            <label className="field"><span>Passwort</span><input type="password" autoComplete="off" value={seedPw} onChange={e => setSeedPw(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') unlockSeed(); }} /></label>
            <button className="primary" onClick={unlockSeed} disabled={!seedPw.trim()}>Freischalten</button>
            <button className="ghost" onClick={() => setSeedBox(null)}>Später</button>
          </div>
        </div>)}

      {list.length === 0 && <div className="card"><div className="tablehead2"><h2>Abrechnungsmonat</h2>{metaFields}</div></div>}

      {list.length > 0 ? (
        <>
        <div className="card tablecard">
          <div className="tablehead2">
            <h2>{meta.monat} {meta.jahr}</h2>
            <span className="sub">{chosen.length} von {list.length} ausgewählt · {chosen.filter(x => x.todo.length).length} mit Handlungsbedarf · <span className="okc">{chosen.filter(x => x.sent).length} versendet</span> · {chosen.filter(x => x.sig && !x.sigChanged).length} unterschrieben</span>
            {metaFields}
          </div>
          <div className="scroll">
            <table className="list c">
              <thead><tr>
                <th></th><th>Mitarbeiter</th>
                {CUR.kpis.map(k => <th key={k.h} className="n" title={k.title || ''}>{k.h}</th>)}
                <th>Sonder €</th><th className="r">Auszahlung</th><th></th>
              </tr></thead>
              <tbody>
                {list.map(x => {
                  const i = x.inp, f = (ov[key(x.e.sheet)] || {}).fields || {};
                  const open = !!more[x.e.sheet];
                  const pills = [];
                  if (x.include && x.todo.length) pills.push(['st-todo', 'Handlungsbedarf', 'Siehe Hinweis unter dem Namen']);
                  if (x.sent) pills.push([x.sentChanged ? 'st-warn' : 'st-sent', x.sentChanged ? `Versendet ${kurzDatum(x.sent.at)} · Betrag geändert` : `Versendet ${kurzDatum(x.sent.at)}`, `An ${x.sent.to} am ${new Date(x.sent.at).toLocaleString('de-DE')} · ${eur(x.sent.total)}`]);
                  if (x.sig) pills.push([x.sigChanged ? 'st-warn' : 'st-sig', x.sigChanged ? `Unterschrift angekommen ${kurzDatum(x.sig.at)} · Betrag geändert` : `Unterschrift angekommen ${kurzDatum(x.sig.at)}`, `Unterschrift vom ${new Date(x.sig.at).toLocaleString('de-DE')} · ${eur(x.sig.total)}`]);
                  if (!pills.length && x.include) pills.push(['st-ready', 'Bereit', '']);
                  return (
                    <React.Fragment key={x.e.sheet}>
                    <tr className={(x.include ? '' : 'off') + (i.shopleiter ? ' hassl' : '') + (x.sent && !x.sentChanged ? ' issent' : '')}>
                      <td className="cb"><input type="checkbox" aria-label={'Einbeziehen: ' + x.e.fullName} checked={x.include} onChange={ev => patch(x.e.sheet, { include: ev.target.checked })} /></td>
                      <td className="who">
                        <strong className="nm" title="Bearbeiten" onClick={() => setEdit(x.e.sheet)}>{x.e.fullName}</strong>
                        {pills.map(p => <span key={p[1]} className={'pill ' + p[0]} title={p[2]}>{p[1]}</span>)}
                        {x.edited && <small className="tag">bearbeitet</small>}
                        {x.inp.notiz && <small className="tag note" title={x.inp.notiz}>Notiz</small>}
                        {!x.row.active && <small className="tag">keine Werte</small>}
                        {(() => {
                          const SH = CUR.GS_LABELS;
                          const ab = x.res.qual.filter(q => q.betrag < 0 && !x.credited(q.row));
                          if (!ab.length) return null;
                          return (<div className="abz">{ab.map(q => {
                            const k = x.res.korr.find(c => c.key === q.row);
                            return <span key={q.row} className="chip neg" title={k && k.note ? k.note : `Abzug · Soll ${fmtQ(q, q.soll)} · Ist ${q.rated ? fmtQ(q, q.ist) : 'fehlt'}`}>
                              {SH[q.row]} {eur(q.betrag)}{k && k.betrag ? ' · Teilgutschrift ' + eur(k.betrag) : ''}
                            </span>;
                          })}</div>);
                        })()}
                        {x.todo.length > 0 && <span className="todoln">{x.todo.join(' · ')}</span>}
                      </td>
                      {CUR.kpis.map(k => <td key={k.h} className={'n' + (k.q && (x.res.qual.find(q => q.row === k.q) || {}).betrag < 0 && !x.credited(k.q) ? ' bad' : '')}>{k.v(i, x.res)}</td>)}
                      <td className="sp">
                        <input className="mini" inputMode="decimal" aria-label="Sonderprovision Betrag" value={f.sonderBetrag ?? ''} placeholder="€" onChange={ev => patch(x.e.sheet, { fields: { sonderBetrag: ev.target.value } })} />
                        {(f.sonderBetrag || f.sonderText) ? <input className="mini an" aria-label="Anlass Sonderprovision" value={f.sonderText ?? ''} placeholder="Anlass" onChange={ev => patch(x.e.sheet, { fields: { sonderText: ev.target.value } })} /> : null}
                      </td>
                      <td className="r pay"><strong>{eur(x.res.total)}</strong><small>Provision {eur(Math.max(x.res.brutto, R.fix))}{x.res.sl ? ' · SL ' + eur(x.res.sl.betrag) : ''}</small></td>
                      <td className="acts">
                        <button className={'btn-s' + (x.inp.signImg ? ' sentbtn' : '')} onClick={() => onePdf(x.inp)} disabled={!!busy} title={x.inp.signImg ? 'PDF inklusive Unterschrift des Mitarbeiters' : 'PDF erzeugen'}>{x.inp.signImg ? 'PDF ✍' : 'PDF'}</button>
                        <button className={'btn-s' + (x.sent ? ' sentbtn' : '')} onClick={() => setMailDlg(x.e.sheet)} disabled={!!busy}>{x.sent ? '✓ E-Mail' : 'E-Mail'}</button>
                        <button className={'btn-s' + (x.sig && !x.sigChanged ? ' sentbtn' : '')} onClick={() => openSign(x.e.sheet)} disabled={!!busy} title="QR-Code: Mitarbeiter unterschreibt die Abrechnung am Handy">{x.sig && !x.sigChanged ? '✓ Unterschrift' : 'Unterschrift'}</button>
                        <button className="btn-s dots" aria-label={'Mehr für ' + x.e.fullName} aria-expanded={open} title="Bearbeiten und Optionen" onClick={() => setMore(m => ({ ...m, [x.e.sheet]: !m[x.e.sheet] }))}><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" fill="currentColor"></circle><circle cx="8" cy="8" r="1.4" fill="currentColor"></circle><circle cx="13" cy="8" r="1.4" fill="currentColor"></circle></svg></button>
                      </td>
                    </tr>
                    {i.shopleiter && (
                      <tr className={'slrow' + (x.include ? '' : ' off')}><td></td>
                        <td colSpan={CUR.kpis.length + 4}>
                          <div className="slline">
                            <strong>Shopleiter-Provision</strong>
                            <label>Margenziel € <input className="mini" inputMode="decimal" value={i.slZiel} onChange={ev => patchSl(x.e.sheet, { slZiel: ev.target.value })} /></label>
                            <label>Marge Ist € <input className="mini" inputMode="decimal" value={i.slIst} placeholder="fehlt" onChange={ev => patchSl(x.e.sheet, { slIst: ev.target.value })} /></label>
                            <label>75–100 % <input className="mini xs" inputMode="decimal" value={i.slRate1} onChange={ev => patchSl(x.e.sheet, { slRate1: ev.target.value })} /> %</label>
                            <label>über 100 % <input className="mini xs" inputMode="decimal" value={i.slRate2} onChange={ev => patchSl(x.e.sheet, { slRate2: ev.target.value })} /> %</label>
                            <span>{x.res.sl && x.res.sl.ziel > 0 ? <>Zielerreichung {pf(x.res.sl.quote)} → <b>{eur(x.res.sl.betrag)}</b></> : 'Margenziel eintragen'}</span>
                          </div>
                        </td>
                      </tr>)}
                    {open && (
                      <tr className="morerow"><td></td>
                        <td colSpan={CUR.kpis.length + 4}>
                          <div className="morebar">
                            <button className="btn-s" onClick={() => setEdit(x.e.sheet)}>Bearbeiten</button>
                            {CUR.features.teilzeit && <label className="tgl"><input type="checkbox" checked={!!i.teilzeit} onChange={ev => patchSl(x.e.sheet, { teilzeit: ev.target.checked })} />Azubi/TZ</label>}
                            {CUR.features.einstieg && <label className="tgl" title="Haken = Einstiegsschwelle gilt. Ohne Haken: Postpaid und DSL ab dem 1. Vertrag"><input type="checkbox" checked={!i.einstiegsfrei} onChange={ev => patchSl(x.e.sheet, { einstiegsfrei: !ev.target.checked })} />Einstiegsschwelle</label>}
                            <label className="tgl"><input type="checkbox" checked={!!i.shopleiter} onChange={ev => patchSl(x.e.sheet, { shopleiter: ev.target.checked })} />Shopleiter</label>
                            {x.sent && <button className="link" onClick={() => patch(x.e.sheet, { sent: null })}>Versand-Haken entfernen</button>}
                          </div>
                        </td>
                      </tr>)}
                    </React.Fragment>);
                })}
              </tbody>
            </table>
          </div>
        </div>
        <div className="gen2">
          <div className="gsum">Auszahlung gesamt<strong>{eur(sum)}</strong></div>
          <div className="gact">
            <label className="field inline"><span>Empfänger</span><input type="email" value={meta.mailTo || ''} placeholder="name@firma.de" onChange={e => setMeta(m => ({ ...m, mailTo: e.target.value }))} /></label>
            <button className="btn-s" disabled={!chosen.length} title="Speichert die Auszahlungen dieses Monats in der Historie" onClick={() => { recordMonth(chosen); setMsg(`${chosen.length} Auszahlungen für ${meta.monat} ${meta.jahr} in der Historie gespeichert.`); }}>In Historie speichern</button>
            <button className="primary out" onClick={sendMail} disabled={!!busy || !chosen.length} title="E-Mail-Entwurf mit ZIP im Anhang">{busy === 'mail' ? 'Erstelle E-Mail …' : 'Per E-Mail senden'}</button>
            <button className="primary" onClick={generateAll} disabled={!!busy || !chosen.length} title="ZIP mit PDF und Excel je Mitarbeiter, Übersicht und Sicherung">{busy === 'zip' ? 'Erstelle Abrechnungen …' : `Provision generieren (${chosen.length})`}</button>
          </div>
        </div>
        </>
      ) : data ? <p className="empty">Für {meta.monat || 'diesen Monat'} gibt es keine Mitarbeiterwerte. Wähle einen anderen Monat.</p> : null}

      {mailDlg && (() => { const x = list.find(l => l.e.sheet === mailDlg); if (!x) return null; return (
        <MailDialog x={x} meta={meta} R={R} mailAddr={mailSet[x.e.sheet]} onClose={() => setMailDlg(null)}
          onSent={to => { setMailSet(m => ({ ...m, [x.e.sheet]: to })); patch(x.e.sheet, { sent: { at: new Date().toISOString(), to, total: x.res.total } }); recordMonth([x]); setMailDlg(null); setMsg(`E-Mail-Entwurf für ${x.inp.vollerName} erstellt – Datei öffnen, sie erscheint in Outlook.`); }} />); })()}
      {signDlg && (() => { const x = list.find(l => l.e.sheet === signDlg); if (!x) return null; return (
        <SignDialog onPdf={() => onePdf(x.inp)} x={x} meta={meta} R={R} rq={relay && sigReq[key(x.e.sheet)] ? { ...sigReq[key(x.e.sheet)], r: relay.repo, t: relay.token } : null} relay={relay} onRelay={saveRelay} onClose={() => setSignDlg(null)}
          onImport={async fs => { await importSigs(fs); setSignDlg(null); }}
          onPoll={() => pollSigs(true)}
          onUnmark={() => { patch(x.e.sheet, { sig: null }); const k = key(x.e.sheet); sigReqRef.current = Object.fromEntries(Object.entries(sigReqRef.current).filter(([z]) => z !== k)); setSigReq(sigReqRef.current); setSignDlg(null); }} />); })()}
      <Rules R={R} setR={setR} />
      <button className="ghost" onClick={() => setEdit('__manual')}>Einzelabrechnung ohne Import</button>
    </div>
  );
}

function Header() {
  return (<header><h1>Provisionsabrechnung <span className="mode">{CUR.title}</span></h1><p>Performance-Excel einlesen, prüfen, Provision generieren.</p></header>);
}

function Root() {
  const [mode, setMode] = useState(() => { try { return localStorage.getItem('provi_mode') || 'o2'; } catch (e) { return 'o2'; } });
  CUR = PROFILES[mode] || PROFILES.o2;
  const pick = m => { try { localStorage.setItem('provi_mode', m); } catch (e) {} setMode(m); };
  return (<>
    <nav className="modes" aria-label="Bereich">
      {Object.values(PROFILES).map(p => <button key={p.id} className={p.id === mode ? 'on' : ''} aria-pressed={p.id === mode} onClick={() => pick(p.id)}>{p.title}</button>)}
    </nav>
    <App key={mode} />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(/^#s=/.test(location.hash) ? <SignApp /> : <Root />);
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body></html>
