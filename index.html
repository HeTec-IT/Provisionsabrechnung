<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provisionsabrechnung</title>
<meta name="theme-color" content="#0A1F44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Provision">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#0A1F44;--blue:#1450F5;--bg:#E9EDF3;--paper:#fff;--muted:#5F6A7D;--line:#D3D9E3;--ok:#0E7A4B;--no:#C2362B;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1360px;margin:0 auto;padding:24px 16px 48px}
header h1{font-size:2rem;font-weight:700;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 20px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 12px;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rules{margin:14px 0 8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.field input,.field select{font:inherit;font-size:1rem;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#F7F9FC;font-variant-numeric:tabular-nums;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:1px;background:#fff}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.link{background:none;border:0;color:var(--blue);padding:0;font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 14px;color:var(--muted)}
.sheet{position:sticky;top:16px;background:var(--paper);border-top:6px solid var(--ink);border-radius:4px 4px 10px 10px;padding:18px;box-shadow:0 1px 0 var(--line)}
.sheethead{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sheethead small{display:block;color:var(--muted);font-size:.75rem}
.sheethead strong{font-size:1.1rem}
.quotes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.quotes span{font-size:.8rem;padding:3px 8px;border-radius:4px;background:#EEF1F6;font-variant-numeric:tabular-nums}
.quotes .ok{background:#E2F3EA;color:var(--ok)}.quotes .no{background:#FBE7E5;color:var(--no)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
td{padding:7px 0;border-bottom:1px solid #EEF1F6;vertical-align:top}
td small{display:block;color:var(--muted);font-size:.75rem;margin-top:1px}
.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;padding-left:10px}
tr.zero td{color:#9AA3B2}tr.zero .amt{font-weight:400}
tr.sum td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
tr.neg .amt{color:var(--no)}tr.pos .amt{color:var(--ok)}
.total{margin-top:16px;padding:14px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;border-top:3px double var(--ink)}
.total span{font-weight:600}
.total strong{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.total em{flex-basis:100%;text-align:right;color:var(--muted);font-size:.8rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:12px;font-weight:600}
.actions button+button{background:var(--blue)}
.actions button:disabled{opacity:.6;cursor:wait}
.err{color:var(--no);font-size:.85rem}
@media (max-width:900px){main{grid-template-columns:1fr}.sheet{position:static}}
.bar{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.drop{border:2px dashed #9AAAC4;border-radius:10px;background:var(--paper);padding:26px 18px;text-align:center;cursor:pointer;margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
.drop.over,.drop:hover{border-color:var(--blue);background:#F2F6FF}
.drop:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.drop span{color:var(--muted);font-size:.9rem}
.msg{margin:0 0 12px;font-size:.9rem;color:var(--ink)}
.empty{color:var(--muted)}
.meta{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.two{grid-template-columns:140px 1fr}
.special{border-left:4px solid var(--blue)}
.tablecard{padding:0;overflow:hidden}
.tablehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 16px 8px}
.tablehead h2{margin:0;font-size:1.25rem}
.tablehead span{color:var(--muted);font-size:.9rem}.tablehead b{color:var(--ink);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:.85rem}
.list th{text-align:left;font-weight:600;font-size:.78rem;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.list td{padding:8px;border-bottom:1px solid #E4E8EF;vertical-align:top;font-variant-numeric:tabular-nums}
.list .r{text-align:right;white-space:nowrap}
.list tr.off td{color:#9AA3B2}
.list .who strong{display:block}
.list .who small{display:inline-block;margin:3px 4px 0 0;font-size:.7rem;padding:1px 6px;border-radius:4px}
.list .warn{background:#FFF3D6;color:#7A5300}
.list .tag{background:#E8EEFF;color:var(--blue)}
.total-cell{font-weight:700}
.acts{white-space:nowrap}.acts .link{margin-right:10px}
.mini{font:inherit;width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#F7F9FC}
.mini.wide{width:200px}
.mini:focus{outline:2px solid var(--blue);background:#fff}
.gen{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border-top:1px solid var(--line);background:#F7F9FC}
.gen small{color:var(--muted)}
.primary{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:13px 22px;font-weight:700;font-size:1rem}
.primary:disabled{opacity:.5;cursor:not-allowed}

.list td{white-space:nowrap}
.list td.who{white-space:normal;min-width:200px}
.list .who strong{display:block}
.list .who .miss{display:block;background:none;padding:0;margin:2px 0 0;color:var(--muted)}

.drop.small{padding:14px 18px;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;align-items:baseline;border-style:dashed}
.list .who .todo{display:block;background:none;padding:0;margin:2px 0 0;color:var(--no);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--no);margin-right:6px;vertical-align:middle}

.check{display:inline-flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
.list .check{font-weight:400}
.grid.sl{margin-top:12px}
.slres{grid-column:1/-1;margin:0;color:var(--muted)}.slres b{color:var(--ok)}
.list tr.hassl td{border-bottom:0}
.list tr.slrow td{padding-top:0;background:#F6F8FC}
.slline{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:.82rem;color:var(--muted);padding:6px 0 4px}
.slline strong{color:var(--ink)}.slline b{color:var(--ok)}
.mini.xs{width:56px}

.gslist{display:flex;flex-direction:column;gap:0}
.gsrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 0;border-bottom:1px solid #EEF1F6}
.gsrow.none{opacity:.55}
.gsname{min-width:170px}.gsname small{display:block;color:var(--muted);font-size:.78rem}
.gsrow .check{font-weight:400;font-size:.9rem}
.field.inline{flex-direction:row;align-items:center;gap:6px}.field.inline input{width:110px}
.gsres{margin-left:auto;color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums}

.rulegroup{margin-top:16px}.rulegroup h3{font-size:.85rem;margin:0 0 6px;color:var(--ink)}
.rulegroup .rules{margin:0}

.list th,.list td{padding:8px 6px}
.list .n{text-align:right;width:1%}
.list th.n{text-align:right}
.list td.cb{white-space:nowrap;width:1%}
.toggles{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:3px}
.tgl{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);cursor:pointer}
.tgl input{margin:0}
.list td.sp{white-space:normal;width:150px}
.list td.sp .mini{display:block;width:100%;margin-bottom:4px;padding:5px 7px;font-size:.82rem}
.list td.pay{width:1%}
.list td.pay strong{display:block;font-size:.98rem}
.list td.pay small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}
.list td.acts{width:1%;white-space:nowrap}
.btn-s{display:block;width:100%;margin-bottom:4px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:.8rem;font-weight:600;color:var(--blue)}
.btn-s:hover{border-color:var(--blue)}
.btn-s:disabled{opacity:.5}
.wrap{max-width:1440px}

.abz{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:.72rem;padding:2px 7px;border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.neg{background:#FBE7E5;color:var(--no)}
.chip.done{background:#E2F3EA;color:var(--ok);text-decoration:none}
.list td.bad{color:var(--no);font-weight:700}

.mailbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.mailbox .field.inline input{width:230px}
.primary.alt{background:var(--blue)}

.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin:0 0 12px;font-size:.82rem;color:var(--muted)}
.backup span{margin-right:auto}
.backup .btn-s{display:inline-block;width:auto;margin:0}
.notes{width:100%;font:inherit;font-size:.95rem;padding:10px;border:1px solid var(--line);border-radius:6px;background:#F7F9FC;resize:vertical}
.notes:focus{outline:2px solid var(--blue);background:#fff}
.field.grund{flex-basis:100%}
.list .tag.note{background:#FFF3D6;color:#7A5300;cursor:help}
.modes{display:flex;gap:4px;max-width:1440px;margin:12px auto 0;padding:0 16px}
.modes button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 18px;font-weight:600;color:var(--muted)}
.modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
header h1 .mode{font-size:1rem;font-weight:600;color:var(--blue);vertical-align:middle;margin-left:8px;background:#E8EEFF;padding:3px 10px;border-radius:6px}

.list .tag.sent{background:#E2F3EA;color:var(--ok);font-weight:700}
.list .tag.sentwarn{background:#FFF3D6;color:#7A5300;font-weight:700}
.list tr.issent td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.btn-s.sentbtn{color:var(--ok);border-color:#9fd6b9;background:#F2FBF6}
.link.tiny{font-size:.7rem;font-weight:400;color:var(--muted);display:block;margin:0 auto}
.link.small{font-size:.8rem;margin:-4px 0 10px;text-align:left}
.okc{color:var(--ok);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,31,68,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0;font-size:1.2rem}
.modal-sub{margin:0 0 6px;color:var(--muted)}.modal-sub b{color:var(--ink)}
.modal .field input{background:#F7F9FC}
.attach{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:.85rem}
.attach .file{background:#EEF1F6;padding:4px 10px;border-radius:6px}
.modal-act{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.modal .hint{color:var(--muted);font-size:.75rem}
.warnline{margin:0;color:#7A5300;font-size:.82rem}
.hist th:first-child,.hist td:first-child{position:sticky;left:0;background:#fff;z-index:1}
.hist td.hc{cursor:pointer}.hist td.hc:hover{background:#EEF3FF}
.hist td.avg,.hist th.avg{font-weight:700;background:#F7F9FC}
.hist tfoot td{font-weight:700;border-top:2px solid var(--ink);background:#F7F9FC}
.hist tfoot td:first-child{background:#F7F9FC}
.hist .none{color:#9AA3B2}
.histform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.histform .field{min-width:150px}.histform .field.betrag{min-width:120px;max-width:160px}
.histbar select{width:auto;min-width:110px}
.qrbox{width:min(320px,100%);margin:0 auto;background:#fff}.qrbox svg{width:100%;height:auto;display:block}
.signwrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.signwrap h1{font-size:1.5rem;margin:0 0 8px}
.signwrap .sheet{position:static;margin:12px 0}
.signwrap .full{display:block;width:100%;margin-top:10px}
.signcheck{display:flex;gap:8px;align-items:flex-start;margin:14px 0;font-size:.95rem}
.sigarea{position:relative;border:2px dashed var(--line);border-radius:10px;background:#fff;margin-top:6px}
.sigarea>span{position:absolute;left:12px;top:8px;color:#9AA3B2;font-size:.8rem;pointer-events:none}
.pdfview{max-width:760px;margin:0 auto;padding:0 0 96px}
.pv-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 6px}.pv-top span{color:var(--muted);font-size:.9rem}
.pv-hint{margin:0 16px 8px;color:var(--muted);font-size:.9rem}
.pv-banner{margin:6px 16px 10px;padding:12px 14px;border-radius:10px;font-size:.95rem;background:#E3F1E9;color:#0B5E30}.pv-banner.warn{background:#FFF4D6;color:#7A5200}
.pdfhost{cursor:pointer}.pdfpage{background:#fff;box-shadow:0 1px 8px rgba(15,23,42,.22);margin:10px 10px 14px;line-height:0}.pdfpage canvas{display:block;width:100%;height:auto}
.pv-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
.pv-bar>div{max-width:728px;margin:0 auto;display:flex;gap:8px}.pv-bar button{flex:1;padding:14px 10px;font-size:1rem}
.pv-sheetbg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pv-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.pv-sheet .signcheck{margin-top:0}.pv-sheetbtns{display:flex;gap:8px;margin-top:12px}.pv-sheetbtns button{padding:13px 10px}.pv-sheetbtns .primary{flex:1.6}
.sigpad{display:block;width:100%;height:170px;touch-action:none;border-radius:10px}
.sigbtns{display:flex;justify-content:flex-end;margin:6px 0 10px}

/* Layout: kompakte Tabelle */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:6px 0 14px}
.topbar h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
.topbar h1 .mode{font-size:.9rem;font-weight:600;color:var(--blue);vertical-align:middle;margin-left:8px;background:#E8EEFF;padding:3px 10px;border-radius:6px}
.topbtns{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.topbtns .btn-s,.tbfields .btn-s{display:inline-block;width:auto;margin:0;padding:8px 14px;font-size:.85rem}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,31,68,.15);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;z-index:20}
.menu .pop button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:6px;color:var(--ink);font-size:.88rem}
.menu .pop button:hover:not(:disabled){background:#EEF3FF}
.menu .pop button:disabled{opacity:.5}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.fchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:0}
.fchip:hover,.fchip.over{border-color:var(--blue);background:#F2F6FF}
.fchip.none{border-style:dashed;border-color:#9AAAC4}
.fchip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fchip .fdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.fchip.none .fdot{background:#B8C2D3}
.fchip .ftxt{min-width:0;flex:1}
.fchip .ftxt small{display:block;color:var(--muted);font-size:.75rem}
.fchip .ftxt b{display:block;font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip .fact{color:var(--blue);font-weight:600;font-size:.85rem}
@media (max-width:900px){.chips{grid-template-columns:1fr}}
.tablehead2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px}
.tablehead2 h2{margin:0;font-size:1.2rem}
.tablehead2 .sub{color:var(--muted);font-size:.85rem}
.tbfields{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-left:auto}
.tbfields label{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.tbfields input,.tbfields select{font:inherit;font-size:.88rem;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#F7F9FC}
.tbfields input.w-y{width:64px}.tbfields input.w-o{width:120px}.tbfields input.w-d{width:100px}
.list.c th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;background:#F5F7FB;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.list.c td{padding:10px 6px;vertical-align:middle}
.list.c td.who{min-width:260px}
.list.c .who strong{display:inline;font-size:.95rem}
.list.c .who strong.nm{cursor:pointer}
.list.c .who strong.nm:hover{color:var(--blue)}
.pill{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.pill.st-ready,.pill.st-sig{background:#E3F1E9;color:#0B5E30}
.pill.st-todo{background:#FDECEA;color:#B42318}
.pill.st-sent{background:#E4EBFB;color:#1239A6}
.pill.st-warn{background:#FFF3D6;color:#7A5300}
.list.c .who .todoln{display:block;color:var(--no);font-size:.78rem;margin-top:3px}
.list.c .abz{margin-top:4px}
.list.c td.sp{width:1%;white-space:nowrap}
.list.c td.sp .mini{display:inline-block;width:88px;margin:0;padding:6px 8px;font-size:.85rem}
.list.c td.sp .mini.an{display:block;width:150px;margin-top:4px}
.list.c td.acts .btn-s{display:inline-block;width:auto;margin:0 0 0 6px;padding:7px 10px}
.btn-s.dots{padding:7px 9px;color:var(--muted);line-height:0}
.list.c tr.morerow td{background:#F6F8FC;padding:8px 6px 10px;border-bottom:1px solid #E4E8EF}
.morebar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.morebar .btn-s{display:inline-block;width:auto;margin:0}
.gen2{position:sticky;bottom:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 12px;box-shadow:0 -4px 16px rgba(10,31,68,.08)}
.gen2 .gsum{color:var(--muted);font-size:.9rem}
.gen2 .gsum strong{color:var(--ink);font-size:1.35rem;margin-left:8px;font-variant-numeric:tabular-nums}
.gen2 .gact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.gen2 .field.inline input{width:220px}
.gen2 .primary{padding:11px 18px;font-size:.95rem}
.gen2 .btn-s{display:inline-block;width:auto;margin:0;padding:10px 14px;font-size:.88rem}
.primary.out{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.mut{color:var(--muted);font-size:.78rem}
</style>

<script>(function (root) {
  const RULES_VERSION = 2;
  const DEFAULT_RULES = {
    ppSchwelle: 6, ppBetrag: 20,
    ksAb: 4, ksBetrag: 15,
    dslSchwelle: 3, dslBetragNiedrig: 15, dslBetragHoch: 30, dslSoll: 0.15,
    dslVvlBetrag: 10,
    vvlSchwelle: 10, vvlBetrag: 5,
    zubSchwelle: 50, zubAnteil: 0.5,
    fhBetrag: 20,
    abwBetrag: 10,
    abzug: 0.25,
    werbSoll: 0.85, pencilSoll: 0.75,
    telTage1: 6, telSoll1: 250, telTage2: 12, telSoll2: 150, telTage3: 18, telSoll3: 100, telSoll4: 50,
    tvSoll: 6, osSoll: 11, tvSollTZ: 3, osSollTZ: 11,
    msySoll: 0.85, msyBonus: 100,
    fix: 250
  };

  const KORR_LABELS = ['Korrektur Werbeversprechen', 'Korrektur PS', 'Korrektur Marketing', 'Korrektur o2 TV', 'Korrektur Online-Schutz', 'Sonstige Korrektur'];
  const GS = [['werb', 'werb'], ['pencil', 'pencil'], ['marketing', 'marketing'], ['tv', 'tv'], ['os', 'os']];

  const n = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(x) ? x : 0; };
  const pct = v => n(v) / 100;
  const r2 = v => Math.round((v + (v >= 0 ? 1e-9 : -1e-9)) * 100) / 100;
  const pf = v => (Math.round(v * 1000) / 10).toLocaleString('de-DE') + ' %';
  const eur = v => v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const e0 = v => (Number.isInteger(v) ? v.toLocaleString('de-DE') + ',-' : v.toLocaleString('de-DE', { minimumFractionDigits: 2 })) + ' €';
  const nf = v => (Math.round(v * 10) / 10).toLocaleString('de-DE');
  const strip = s => String(s).replace(/\*\*/g, '');
  // Alle 5 Qualitätsziele des Shops erreicht → keine Einstiegsschwelle für Postpaid und DSL (ab dem ersten Vertrag)
  const effR = (inp, R) => inp && inp.einstiegsfrei ? { ...R, ppSchwelle: 0, dslSchwelle: 0 } : R;
  const gr = s => s > 0 ? `größer ${s} Stück` : 'ab dem ersten Stück';
  // Telefonie-Soll je Monat, gestaffelt nach Abwesenheitstagen (Urlaub + Krank): bis 6 Tage 250, bis 12 Tage 150, bis 18 Tage 100, länger 50
  const telSollFor = (R, tage) => tage <= R.telTage1 ? R.telSoll1 : tage <= R.telTage2 ? R.telSoll2 : tage <= R.telTage3 ? R.telSoll3 : R.telSoll4;

  function regularien(R0, inp) {
    const R = effR(inp, R0);
    const L = [
      `Sollten die Qualitätsziele von dem Mitarbeiter nicht erreicht werden, wird je Qualitätsziel, welches nicht erreicht wird, ${pf(R.abzug)} von der Provisionssumme abgezogen.`,
      `Qualitätsziele o2 TV und Online-Schutz je Monat (anteilig nach Arbeitstagen): Vollzeit ${R.tvSoll} TV und ${R.osSoll} Online-Schutz, Azubis/Teilzeit ${R.tvSollTZ} TV und ${R.osSollTZ} Online-Schutz.`,
      `Wenn der Mitarbeiter einen MSY Wert größer ${pf(R.msySoll)} erreicht, gibt es einmalig ${eur(R.msyBonus)} für den Mitarbeiter.`,
      `Der Mitarbeiter erhält ${eur(R.ppBetrag)} je o2 Postpaid-Neuvertrag ${gr(R.ppSchwelle)}.`,
      `Wenn die DSL-Quote größer ${pf(R.dslSoll)} ist, erhält der Mitarbeiter ${eur(R.dslBetragHoch)} je DSL-Neuvertrag ${gr(R.dslSchwelle)}, sonst ${eur(R.dslBetragNiedrig)} je DSL-Neuvertrag ${gr(R.dslSchwelle)}. DSL-Quote = DSL-Neuverträge / (Postpaid „normal“ + VVL).`,
      `Der Mitarbeiter erhält je Urlaubstag und Krankheitstag ${eur(R.abwBetrag)} Provisionsauszahlung.`,
      'Mündliche Nebenabreden zu dieser Abrechnung bestehen nicht. Jede Änderung der Abrechnung muss schriftlich vereinbart werden.',
      `FIXPROVISION: Der Mitarbeiter erhält mindestens ${eur(R.fix)} PROVISION FIX pro Monat, auch wenn die Provisionszahlung aus Vertriebszahlen und Qualitätszielen nicht erreicht wird.`
    ];
    if (inp && inp.einstiegsfrei) L.splice(L.length - 1, 0, 'Alle fünf monatlichen Qualitätsziele des Shops wurden erreicht: Postpaid und DSL werden in diesem Monat ab dem ersten Vertrag provisioniert (keine Einstiegsschwelle).');
    return L;
  }

  function calc(inp, R) {
    R = effR(inp, R);
    const po = n(inp.po), kombi = n(inp.kombi), kombiData = n(inp.kombiData), vvl = n(inp.vvl);
    const dsl = n(inp.dsl), dslVvl = n(inp.dslVvl), schutzOnline = n(inp.schutzOnline), tv = n(inp.tv);
    const handys = n(inp.handys), ks = n(inp.ks), marge = n(inp.zubMarge);
    const urlaub = n(inp.urlaub), krank = n(inp.krank), fh = n(inp.fachhandel);
    const at = inp.arbeitstage === '' || inp.arbeitstage == null ? 25 : n(inp.arbeitstage);
    const von = inp.arbeitstageVon === '' || inp.arbeitstageVon == null ? 25 : n(inp.arbeitstageVon);
    const basis = po + vvl;
    const q = {
      poGes: po + kombi + kombiData,
      ks: handys > 0 ? ks / handys : 0,
      dsl: basis > 0 ? dsl / basis : 0,
      anteil: von > 0 ? at / von : 1
    };
    const p = v => Math.round(v * 100) + ' %';
    const dslRel = Math.max(dsl - R.dslSchwelle, 0), dslOk = q.dsl > R.dslSoll;
    const rows = [
      { row: 'pp', rich: `o2 **Postpaid** (Voice/Data) **${gr(R.ppSchwelle)}**`, quote: null, ist: q.poGes, rel: Math.max(q.poGes - R.ppSchwelle, 0), betrag: R.ppBetrag, dform: c => `MAX(${c}-${R.ppSchwelle},0)` },
      { row: 'ks', rich: `Komplettschutz ab der ${R.ksAb}. Versicherung ${R.ksBetrag}€`, quote: q.ks, ist: ks, rel: Math.max(ks - (R.ksAb - 1), 0), betrag: R.ksBetrag, dform: c => `MAX(${c}-${R.ksAb - 1},0)` },
      { row: 'dsl1', rich: `je **o2 DSL** Neuvertrag **${gr(R.dslSchwelle)}**, DSL-Quote bis ${p(R.dslSoll)}`, quote: q.dsl, ist: dsl, rel: dslOk ? 0 : dslRel, betrag: R.dslBetragNiedrig, dform: (c, b) => `IF(${b}>${R.dslSoll},0,MAX(${c}-${R.dslSchwelle},0))` },
      { row: 'dsl2', rich: `je **o2 DSL** Neuvertrag **${gr(R.dslSchwelle)}** & **größer ${p(R.dslSoll)}** DSL-Quote`, quote: q.dsl, ist: dsl, rel: dslOk ? dslRel : 0, betrag: R.dslBetragHoch, dform: (c, b) => `IF(${b}>${R.dslSoll},MAX(${c}-${R.dslSchwelle},0),0)` },
      { row: 'dslvvl', rich: `je **O2 DSL VVL ab der ersten**`, quote: null, ist: dslVvl, rel: dslVvl, betrag: R.dslVvlBetrag, dform: c => c },
      { row: 'vvl', rich: `o2 **VVL** größer **${R.vvlSchwelle} Stück**`, quote: null, ist: vvl, rel: Math.max(vvl - R.vvlSchwelle, 0), betrag: R.vvlBetrag, dform: c => `MAX(${c}-${R.vvlSchwelle},0)` },
      { row: 'zub', rich: `jeder Euro Zubehör Marge **größer ${e0(R.zubSchwelle)} Zubehör Marge** wird mit ${Math.round(R.zubAnteil * 100)}% Provision vergütet`, quote: null, ist: marge, rel: marge > R.zubSchwelle ? (marge - R.zubSchwelle) * R.zubAnteil : 0, betrag: 1, euro: true, dform: c => `IF(${c}>${R.zubSchwelle},(${c}-${R.zubSchwelle})*${R.zubAnteil},0)` },
      { row: 'fh', rich: `Je Fachhandel Aktivierung Mobilfunk Neu/Mobilfunk VVL/DSL Neu/DSL VVL`, quote: null, ist: fh, rel: fh, betrag: R.fhBetrag, dform: c => c },
      { row: 'abw', rich: `Urlaub/Krankheit/Schulung`, small: true, quote: null, ist: urlaub + krank, rel: urlaub + krank, betrag: R.abwBetrag, dform: c => c }
    ].map(r => ({ ...r, label: strip(r.rich), aus: r.rel > 0 ? r2(r.rel * r.betrag) : 0 }));
    const pushText = String(inp.pushText || '').trim();
    rows.push({ row: 'push', rich: '**Push-Provision**' + (pushText ? ': ' + pushText : ''), label: 'Push-Provision' + (pushText ? ': ' + pushText : ''), quote: null, ist: null, rel: null, betrag: null, aus: r2(n(inp.pushBetrag)) });
    const summe = r2(rows.reduce((s, r) => s + r.aus, 0));
    const tz = !!inp.teilzeit;
    const tvSollAnteilig = (tz ? R.tvSollTZ : R.tvSoll) * q.anteil;
    const osSollAnteilig = (tz ? R.osSollTZ : R.osSoll) * q.anteil;
    const has = v => !(v === '' || v == null || (typeof v === 'number' && !isFinite(v)));
    const qual = [
      { row: 'werb', label: 'Werbeversprechen', soll: R.werbSoll, ist: pct(inp.werb), rated: has(inp.werb), fmt: 'pct' },
      { row: 'pencil', label: 'Pencil-Selling', soll: R.pencilSoll, ist: pct(inp.pencil), rated: has(inp.pencil), fmt: 'pct' },
      { row: 'marketing', label: 'Marketing Aktivitäten', soll: telSollFor(R, urlaub + krank), abwTage: urlaub + krank, ist: n(inp.marketing), rated: has(inp.marketing), fmt: 'num' },
      { row: 'tv', label: `o2 TV unter ${nf(tvSollAnteilig)} Stück im Monat${tz ? ' (Azubi/Teilzeit)' : ''}`, soll: tvSollAnteilig, ist: tv, rated: true, fmt: 'num' },
      { row: 'os', label: `Online-Schutz unter ${nf(osSollAnteilig)} Stück im Monat${tz ? ' (Azubi/Teilzeit)' : ''}`, soll: osSollAnteilig, ist: schutzOnline, rated: true, fmt: 'num' }
    ].map(x => { const f = x.ist < x.soll ? -R.abzug : 0; return { ...x, faktor: f, betrag: r2(summe * f) }; });
    const msyIst = pct(inp.msy);
    const msy = { row: 'msy', label: `MSY Mitarbeiter größer ${p(R.msySoll)} gibt ${e0(R.msyBonus)}`, soll: R.msySoll, ist: msyIst, betrag: msyIst > R.msySoll ? R.msyBonus : 0 };
    const korr = GS.map(([k, qrow], i) => {
      const qx = qual.find(x => x.row === qrow); const ded = -qx.betrag; const mode = inp['gs_' + k];
      let b = 0;
      if (ded > 0 && mode === 'voll') b = ded;
      if (ded > 0 && mode === 'teil') b = Math.min(Math.max(n(inp['gsb_' + k]), 0), ded);
      b = r2(b);
      return { row: 'k_' + k, key: k, label: KORR_LABELS[i], betrag: b, abzug: ded,
        grund: String(inp['gsr_' + k] || '').trim(),
        note: b ? (mode === 'voll' ? 'Kulanz: volle Gutschrift' : `Kulanz: Teilgutschrift ${eur(b)} von ${eur(ded)}`) + (String(inp['gsr_' + k] || '').trim() ? ' – ' + String(inp['gsr_' + k]).trim() : '') : '' };
    });
    const ksT = String(inp.korrSonstText || '').trim();
    korr.push({ row: 'k_sonst', key: 'sonst', label: KORR_LABELS[5] + (ksT ? ': ' + ksT : ''), betrag: r2(n(inp.korrSonst)), note: '' });
    let sl = null;
    if (inp.shopleiter) {
      const ziel = n(inp.slZiel), ist = n(inp.slIst), r1 = pct(inp.slRate1), r2_ = pct(inp.slRate2), unten = ziel * 0.75;
      const band = (ist < ziel ? ist : ziel) - unten, ueber = ist > ziel ? ist - ziel : 0;
      const betrag = ziel > 0 ? r2(Math.max(0, band * r1 + ueber * r2_)) : 0;
      sl = { ziel, ist, quote: ziel > 0 ? ist / ziel : 0, band, ueber, r1, r2: r2_, betrag, fehlt: inp.slIst === '' || inp.slIst == null || !ziel };
    }
    const brutto = r2(summe + qual.reduce((s, x) => s + x.betrag, 0) + msy.betrag + korr.reduce((s, k) => s + k.betrag, 0) + (sl ? sl.betrag : 0));
    const sonder = { betrag: r2(n(inp.sonderBetrag)), text: String(inp.sonderText || '').trim() };
    const total = r2(Math.max(brutto, R.fix) + sonder.betrag);
    return { q, rows, summe, qual, msy, korr, sonder, sl, brutto, total, fixGreift: brutto < R.fix, tz };
  }

  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  function monatsInfo(inp) {
    const m = MONATE.findIndex(x => x.toLowerCase() === String(inp.monat || '').trim().toLowerCase());
    const j = parseInt(inp.jahr, 10) || new Date().getFullYear();
    const pad = v => String(v).padStart(2, '0');
    if (m < 0) return { von: '', bis: '', vereinbarung: String(inp.monat || ''), naechster: '', jahr: j };
    const last = new Date(j, m + 1, 0).getDate();
    return {
      von: `01.${pad(m + 1)}.${j}`, bis: `${last}.${pad(m + 1)}.${j}`,
      vereinbarung: `${MONATE[m]} ${j}`,
      naechster: m === 11 ? `Januar ${j + 1}` : MONATE[m + 1],
      jahr: j
    };
  }

  function buildPdf(jsPDF, inp, R) {
    const res = calc(inp, R);
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const YEL = [255, 255, 0], GRY = [217, 217, 217], DRK = [64, 64, 64], ORA = [244, 156, 82], GRN = [146, 208, 80], LGR = [242, 242, 242], WHT = [255, 255, 255];
    const X = [9.3, 107.3, 113.8, 125.2, 138.9, 161.5, 184.8];
    const RH = 5.1;
    const F = 'helvetica';

    const box = (x1, y1, x2, y2, fill, lw = 0.15) => {
      doc.setLineWidth(lw); doc.setDrawColor(0);
      if (fill) { doc.setFillColor(...fill); doc.rect(x1, y1, x2 - x1, y2 - y1, 'FD'); }
      else doc.rect(x1, y1, x2 - x1, y2 - y1, 'S');
    };
    const txt = (s, x, y, o = {}) => {
      doc.setFont(F, o.bold ? 'bold' : 'normal'); doc.setFontSize(o.size || 7.5); doc.setTextColor(...(o.color || [0, 0, 0]));
      doc.text(String(s), x, y, { align: o.align || 'left' });
    };
    // Text mit **fett**-Abschnitten, schrumpft bei Überlänge
    const rich = (s, x, y, maxW, size = 7.5) => {
      const parts = s.split('**');
      const width = sz => parts.reduce((w, t, i) => { doc.setFont(F, i % 2 ? 'bold' : 'normal'); doc.setFontSize(sz); return w + doc.getTextWidth(t); }, 0);
      let sz = size; while (width(sz) > maxW && sz > 5) sz -= 0.25;
      let cx = x;
      parts.forEach((t, i) => { if (!t) return; doc.setFont(F, i % 2 ? 'bold' : 'normal'); doc.setFontSize(sz); doc.setTextColor(0); doc.text(t, cx, y); cx += doc.getTextWidth(t); });
    };
    const de = (v, d = 2) => v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
    const eur2 = v => de(v) + ' €';
    const pc = v => Math.round(v * 100) + '%';
    const st = v => (Math.round(v * 100) / 100).toLocaleString('de-DE');
    // Buchhaltungsformat wie in Excel: "-  €" bei 0, Minus links in der Zelle
    const acc = (v, x1, x2, y, o = {}) => {

// ---------- Historie: alle Provisionen je Mitarbeiter und Monat, lokal im Browser ----------
const histKey = (jahr, monat, sheet) => `${jahr}|${monat}|${sheet}`;
const monIdx = m => MONATE.indexOf(m);
const avgOf = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
const eurN = v => v == null ? '–' : eur(v);
const parseBetrag = t => { const s = String(t).trim(); if (!s) return null; const v = s.includes(',') ? parseFloat(s.replace(/\./g, '').replace(',', '.')) : parseFloat(s); return isFinite(v) ? Math.round(v * 100) / 100 : null; };
const colLetter = i => { let s = '', n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
// Gleicher Name (ohne Groß-/Kleinschreibung) = gleiche Zeile, auch wenn das Blatt anders heißt als beim Import
const canonSheet = (hist, name, sheet) => {
  const n = String(name || '').trim().toLowerCase(); if (!n) return sheet;
  const e = Object.values(hist).find(x => String(x.name || '').trim().toLowerCase() === n);
  return e ? e.sheet : sheet;
};
// Bereits versendete Abrechnungen (Versandnachweise) in die Historie übernehmen, ohne vorhandene Einträge zu überschreiben
function histFromSent(ov, employees, hist) {
  const out = { ...hist };
  Object.entries(ov || {}).forEach(([k, o]) => {
    const s = o && o.sent;
    if (!s || typeof s.total !== 'number') return;
    const [jahr, monat, ...r] = k.split('|'); const sheet = r.join('|');
    if (!jahr || monIdx(monat) < 0 || !sheet) return;
    const emp = (employees || []).find(e => e.sheet === sheet);
    const name = emp ? emp.fullName : sheet, sh = canonSheet(out, name, sheet), kk = histKey(jahr, monat, sh);
    if (out[kk]) return;
    out[kk] = { jahr, monat, sheet: sh, name, total: s.total, at: s.at || '', src: 'versand' };
  });
  return out;
}

// Einträge zusammenführen: gleicher Name = gleiche Zeile, vorhandene Einträge bleiben unverändert
function mergeHist(hist, src) {
  const out = { ...hist }; let n = 0, skip = 0, last = null;
  Object.values(src || {}).forEach(e => {
    if (!e || monIdx(e.monat) < 0 || typeof e.total !== 'number' || !e.jahr) return;
    const sheet = canonSheet(out, e.name, e.sheet), k = histKey(e.jahr, e.monat, sheet);
    if (out[k]) { skip++; return; }
    out[k] = { jahr: String(e.jahr), monat: e.monat, sheet, name: e.name || sheet, total: e.total, at: new Date().toISOString(), src: 'import' };
    last = String(e.jahr); n++;
  });
  return { out, n, skip, last };
}
// Verschlüsselte Start-Historie (AES-GCM, Schlüssel per PBKDF2 aus dem Passwort)
const seedB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const seedNorm = s => String(s || '').replace(/[\s-]/g, '').toUpperCase();
async function decryptSeed(seed, pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(seedNorm(pw)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: seedB64(seed.salt), iterations: seed.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: seedB64(seed.iv) }, key, seedB64(seed.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function Historie({ hist, setHist, title, profil, onBack, defJahr }) {
  const fileRef = useRef();
  const all = useMemo(() => Object.values(hist), [hist]);
  const jahre = useMemo(() => [...new Set(all.map(e => String(e.jahr)))].sort(), [all]);
  const [jahr, setJahr] = useState(() => jahre.includes(String(defJahr)) ? String(defJahr) : (jahre[jahre.length - 1] || 'alle'));
  const [f, setF] = useState({ name: '', monat: MONATE[new Date().getMonth()], jahr: String(defJahr), betrag: '' });
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const rows = useMemo(() => all.filter(e => jahr === 'alle' || String(e.jahr) === jahr), [all, jahr]);
  const cols = useMemo(() => {
    const m = new Map(); rows.forEach(e => m.set(e.jahr + '|' + e.monat, { jahr: String(e.jahr), monat: e.monat }));
    return [...m.values()].sort((a, b) => a.jahr === b.jahr ? monIdx(a.monat) - monIdx(b.monat) : a.jahr.localeCompare(b.jahr));
  }, [rows]);
  const people = useMemo(() => {
    const m = new Map();
    rows.forEach(e => { const p = m.get(e.sheet); if (!p || (e.at || '') > p.at) m.set(e.sheet, { sheet: e.sheet, name: e.name || e.sheet, at: e.at || '' }); });
    return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
  }, [rows]);
  const cell = useMemo(() => { const m = {}; rows.forEach(e => { m[histKey(e.jahr, e.monat, e.sheet)] = e; }); return m; }, [rows]);
  const names = useMemo(() => [...new Set(all.map(e => e.name || e.sheet))].sort((a, b) => a.localeCompare(b, 'de')), [all]);
  const val = (p, c) => { const e = cell[histKey(c.jahr, c.monat, p.sheet)]; return e ? e.total : null; };
  const rowVals = p => cols.map(c => val(p, c)).filter(v => v != null);
  const colVals = c => people.map(p => val(p, c)).filter(v => v != null);
  const allVals = rows.map(e => e.total);
  const colLabel = c => c.monat.slice(0, 3) + ' ' + (jahr === 'alle' ? c.jahr : c.jahr.slice(2));

  function editCell(p, c) {
    const k = histKey(c.jahr, c.monat, p.sheet); const cur = hist[k];
    const t = window.prompt(`${p.name} – ${c.monat} ${c.jahr}\nProvision in € (leer = Eintrag löschen)`, cur ? String(cur.total).replace('.', ',') : '');
    if (t === null) return;
    if (t.trim() === '') { setHist(h => { const n = { ...h }; delete n[k]; return n; }); setNote('Eintrag gelöscht.'); return; }
    const v = parseBetrag(t);
    if (v == null) { setNote('Ungültiger Betrag.'); return; }
    setHist(h => ({ ...h, [k]: { jahr: c.jahr, monat: c.monat, sheet: p.sheet, name: (h[k] && h[k].name) || p.name, total: v, at: new Date().toISOString(), src: 'manuell' } }));
    setNote('Eintrag geändert.');
  }

  function addEntry() {
    const name = f.name.trim(), j = f.jahr.trim(), v = parseBetrag(f.betrag);
    if (!name || !j || v == null) { setNote('Bitte Mitarbeiter, Monat, Jahr und Betrag ausfüllen.'); return; }
    const known = all.find(e => (e.name || e.sheet).toLowerCase() === name.toLowerCase());
    const sheet = known ? known.sheet : name;
    setHist(h => ({ ...h, [histKey(j, f.monat, sheet)]: { jahr: j, monat: f.monat, sheet, name: known ? (known.name || known.sheet) : name, total: v, at: new Date().toISOString(), src: 'manuell' } }));
    setJahr(j); setF(x => ({ ...x, betrag: '' }));
    setNote(`${name}: ${f.monat} ${j} mit ${eur(v)} eingetragen.`);
  }

  async function importFile(file) {
    try {
      const b = JSON.parse(await file.text());
      if (b.app !== 'hetec-provisionsabrechnung-historie') throw new Error('Keine Historien-Datei.');

}

// ---------- Vorschau: Hochrechnung der Provision aus einem Zwischenstand (nur lokal im Browser) ----------
const PREV_COLS = { po: 'nv', kombi: 'nvkombi', vvl: 'vvl', dsl: 'dsl', dslVvl: 'dslvvl', handys: 'hw', ks: 'versicherung', tv: 'o2tv', schutzOnline: 'onlineschutz' };
const PREV_LABEL = { po: 'NV', kombi: 'NV Kombi', vvl: 'VVL', dsl: 'DSL', dslVvl: 'DSL VVL', handys: 'HW', ks: 'Versicherung', tv: 'O2 TV', schutzOnline: 'Onlineschutz' };
const normHead = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const prevNum = v => { if (typeof v === 'number') return isFinite(v) ? v : null; const t = String(v == null ? '' : v).replace(/[€\s]/g, ''); return t ? parseBetrag(t) : null; };
const isoD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromIso = t => { const [y, m, d] = String(t).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
function holidaysBW(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(y, mo - 1, da), add = n => { const x = new Date(easter); x.setDate(x.getDate() + n); return isoD(x); };
  return new Set([`${y}-01-01`, `${y}-01-06`, `${y}-05-01`, `${y}-10-03`, `${y}-11-01`, `${y}-12-25`, `${y}-12-26`, add(-2), add(1), add(39), add(50), add(60)]);
}
// Verkaufstage: Montag bis Samstag ohne Feiertage Baden-Württemberg
function workdays(from, to) {
  let n = 0; const H = {};
  for (const d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) { const y = d.getFullYear(); H[y] = H[y] || holidaysBW(y); if (d.getDay() !== 0 && !H[y].has(isoD(d))) n++; }
  return n;
}
function parsePrevGrid(grid) {
  const rows = grid.map(r => r.map(c => c == null ? '' : c));
  const hi = rows.findIndex(r => { const h = r.map(normHead); return h.includes('vvl') && h.includes('dsl'); });
  if (hi < 0) throw new Error('Keine Kopfzeile mit VVL und DSL gefunden.');
  const head = rows[hi].map(normHead), col = {};
  Object.entries(PREV_COLS).forEach(([k, h]) => { const i = head.indexOf(h); if (i >= 0) col[k] = i; });
  if (col.po == null && head.indexOf('poges') >= 0) col.po = head.indexOf('poges');
  if (col.po == null) throw new Error('Spalte „NV“ (oder „PO ges.“) fehlt.');
  let zeitraum = null;
  rows.slice(0, hi + 1).forEach(r => r.forEach(c => {
    const m = !zeitraum && /(\d{1,2})\.(\d{1,2})\.(\d{4})\s*[-–]\s*(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(String(c));
    if (m) zeitraum = { von: `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`, bis: `${m[6]}-${m[5].padStart(2, '0')}-${m[4].padStart(2, '0')}` };
  }));
  const used = new Set(Object.values(col)), width = Math.max(...rows.map(r => r.length));
  let nc = 0, best = -1;
  for (let c = 0; c < width; c++) {
    if (used.has(c)) continue;
    const n = rows.slice(hi + 1).filter(r => { const v = String(r[c] == null ? '' : r[c]).trim(); return v && prevNum(v) == null; }).length;
    if (n > best) { best = n; nc = c; }
  }
  const out = [];
  for (let r = hi + 1; r < rows.length; r++) {
    const name = String(rows[r][nc] == null ? '' : rows[r][nc]).trim();
    if (!name || /^(summe|gesamt|total)\b/i.test(name) || /eintr/i.test(name)) continue;
    const vals = {}; let any = false;
    Object.entries(col).forEach(([k, i]) => { const v = prevNum(rows[r][i]); vals[k] = v == null ? 0 : v; if (v != null) any = true; });
    if (any) out.push({ name, vals });
  }
  if (!out.length) throw new Error('Keine Datenzeilen gefunden.');
  return { zeitraum, cols: Object.keys(col), rows: out };
}
function textToGrid(t) {
  const lines = String(t).split(/\r?\n/).filter(l => l.trim());
  const dl = ['\t', ';', ','].find(d => lines.slice(0, 6).some(l => l.includes(d))) || '\t';
  return lines.map(l => l.split(dl).map(c => c.trim().replace(/^"|"$/g, '')));
}

function Vorschau({ data, R, hist, tzSet, slSet, esSet, onBack }) {
  const isO2 = CUR.id === 'o2';
  const [raw, setRaw] = useState(() => load(pk('prev'), null));

  const [fOv, setFOv] = useState('');
  const [qm, setQm] = useState('erreicht');
  const [abw, setAbw] = useState({});
  const [paste, setPaste] = useState(null);
  const [msg, setMsg] = useState('');
  const fileRef = useRef();

  function applyGrid(grid, name) {
    try {
      const p = parsePrevGrid(grid);
      setRaw({ file: name, at: new Date().toISOString(), ...p });
      if (p.zeitraum) { const t = new Date(), bis = fromIso(p.zeitraum.bis), von = fromIso(p.zeitraum.von); setStand(isoD(t >= von && t <= bis ? t : bis)); }
      setMsg(`${p.rows.length} Zeilen aus „${name}“ eingelesen.`);
    } catch (e) { setMsg('Nicht eingelesen: ' + e.message); }
  }
  async function onFile(f) {
    try {
      let grid;
      if (/\.xls[xm]$/i.test(f.name)) {
        const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
        const ws = wb.worksheets.find(w => !w.state || w.state === 'visible') || wb.worksheets[0];
        grid = []; for (let r = 1; r <= ws.rowCount; r++) { const row = []; for (let c = 1; c <= Math.max(ws.columnCount, 1); c++) row.push(CUR.core.cellVal(ws.getCell(r, c))); grid.push(row); }
      } else grid = textToGrid(await f.text());
      applyGrid(grid, f.name);
    } catch (e) { setMsg('Datei konnte nicht gelesen werden: ' + e.message); }
  }

  const von = raw && raw.zeitraum ? fromIso(raw.zeitraum.von) : (() => { const d = fromIso(stand); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  const bis = raw && raw.zeitraum ? fromIso(raw.zeitraum.bis) : new Date(von.getFullYear(), von.getMonth() + 1, 0);
  const standD = fromIso(stand), monat = MONATE[von.getMonth()], jahr = von.getFullYear();
  const elapsed = workdays(von, standD < bis ? standD : bis), total = Math.max(workdays(von, bis), 1);
  const autoF = elapsed > 0 ? total / elapsed : 1;
  const fOvN = parseFloat(String(fOv).replace(',', '.'));
  const factor = fOvN > 0 ? fOvN : autoF;
  const f2 = v => v.toLocaleString('de-DE', { maximumFractionDigits: 2 });

  const { rows, unmatched } = useMemo(() => {

    const used = new Set(), mi = monIdx(monat);

    const out = [];
    data.employees.forEach(e => {
      const m = CUR.core.matchDne(e.fullName, e.sheet, list); if (!m) return; used.add(m.name);
      const hr = k => Math.round((m.vals[k] || 0) * factor);
      const pm = Object.keys(e.rows).filter(x => monIdx(x) >= 0 && monIdx(x) < mi && e.rows[x].active).sort((a, b) => monIdx(b) - monIdx(a))[0];
      const prow = pm ? e.rows[pm].inp : {};
      const abwD = Number(String(abw[e.sheet] || '').replace(',', '.')) || 0;
      const sl = slSet[e.sheet] || {};
      const qv = qm === 'erreicht' ? { werb: Math.round(R.werbSoll * 100), pencil: Math.round(R.pencilSoll * 100), marketing: telSoll(abwD), msy: '' } : { werb: prow.werb ?? '', pencil: prow.pencil ?? '', marketing: prow.marketing ?? '', msy: prow.msy ?? '' };
      const inp = { ...CUR.BLANK, name: e.sheet, vollerName: e.fullName, monat, jahr: String(jahr),
        po: hr('po'), kombi: hr('kombi'), vvl: hr('vvl'), dsl: hr('dsl'), dslVvl: hr('dslVvl'), handys: hr('handys'), ks: hr('ks'), tv: hr('tv'), schutzOnline: hr('schutzOnline'),
        kombiData: prow.kombiData ?? '', zubStk: prow.zubStk ?? '', zubMarge: prow.zubMarge ?? '', fachhandel: prow.fachhandel ?? '', urlaub: abwD || '', krank: '', ...qv,
        teilzeit: !!tzSet[e.sheet], einstiegsfrei: !!esSet[`${jahr}|${monat}|${e.sheet}`], shopleiter: !!sl.on, slRate1: sl.r1 ?? '', slRate2: sl.r2 ?? '', slZiel: sl.ziel ?? '', slIst: '' };
      const res = calc(inp, R);
      const pj = mi === 0 ? jahr - 1 : jahr, pmon = MONATE[(mi + 11) % 12], nm = String(e.fullName).trim().toLowerCase();
      const ph = Object.values(hist || {}).find(h => String(h.jahr) === String(pj) && h.monat === pmon && (h.sheet === e.sheet || String(h.name || '').trim().toLowerCase() === nm));

  const SH = CUR.GS_LABELS;

            </div>)}
          {raw && <p className="empty" style={{ margin: '12px 0 0', fontSize: '.85rem' }}>{raw.file} · {raw.rows.length} Zeilen{raw.zeitraum ? ` · Zeitraum ${fromIso(raw.zeitraum.von).toLocaleDateString('de-DE')} bis ${fromIso(raw.zeitraum.bis).toLocaleDateString('de-DE')}` : ''} · Spalten: {raw.cols.map(k => PREV_LABEL[k]).join(', ')}</p>}
        </div>
        {raw && !data && <p className="empty">Für die Zuordnung der Namen bitte zuerst die Performance-Excel einlesen.</p>}
        {raw && data && (<>
          <div className="card">
            <h2>2 · Hochrechnung</h2>
            <div className="tbfields" style={{ marginLeft: 0 }}>
              <label>Stand (inkl.) <input type="date" value={stand} onChange={e => setStand(e.target.value)} /></label>
              <label>Faktor <input className="w-y" inputMode="decimal" placeholder={f2(autoF)} value={fOv} onChange={e => setFOv(e.target.value)} /></label>

            </div>
            <p className="empty" style={{ margin: '10px 0 0', fontSize: '.88rem' }}>{elapsed} von {total} Verkaufstagen (Mo–Sa, ohne Feiertage Baden-Württemberg) bis {standD.toLocaleDateString('de-DE')} → Faktor <b>×{f2(factor)}</b>. Stückzahlen werden gerundet.</p>

            </div>

                        </tr>);

          <p className="empty" style={{ fontSize: '.82rem' }}>Simulation, keine verbindliche Abrechnung. Annahmen: Qualitätsziele {qm === 'erreicht' ? 'werden als erreicht angenommen (kein Abzug)' : 'wie im letzten Monat der Performance-Datei'}; Zubehör-Marge, Fachhandel und Kombi Data wie im Vormonat; Shopleiter-Provision ohne Marge-Ist = 0; Einstiegsschwelle und Azubi/Teilzeit wie im Dashboard; Online-Schutz PLUS, Prepaid und INT fließen nicht ein.</p>
        </>)}
      </>)}
    </div>
  );
}

// ---------- Unterschrift am Handy: Die Daten stecken im Link (#s=…), es gibt keinen Server ----------
const b64uEnc = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64uDec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
// Rückkanal über das eigene (private) GitHub-Repository: Die Unterschrift wird auf dem Handy mit einem Schlüssel aus dem Link
// (nur im #-Teil) verschlüsselt und als Datei im privaten Repo abgelegt. Das Dashboard holt sie ab, entschlüsselt sie und löscht die Datei.
const REPO_RE = /^[\w.-]+\/[\w.-]+$/;
const loadRelay = () => { try { const r = JSON.parse(localStorage.getItem('provi_relay')); return r && REPO_RE.test(r.repo || '') && r.token ? r : null; } catch (e) { return null; } };
const rnd = n => b64uEnc(crypto.getRandomValues(new Uint8Array(n)));
const ghUrl = (repo, id) => `https://api.github.com/repos/${repo}/contents/sig/${encodeURIComponent(id)}.json`;
const ghHead = t => ({ Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' });
async function relayKey(k, use) { return crypto.subtle.importKey('raw', b64uDec(k), 'AES-GCM', false, [use]); }
async function relayPut(q, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await relayKey(q.k, 'encrypt'), new TextEncoder().encode(JSON.stringify(obj))));
  const body = JSON.stringify({ iv: b64uEnc(iv), ct: b64uEnc(ct), at: Date.now() });
  const r = await fetch(ghUrl(q.r, q.i), { method: 'PUT', headers: ghHead(q.t), body: JSON.stringify({ message: 'Unterschrift', content: btoa(body) }) });
  if (!r.ok) throw new Error(r.status === 422 ? 'schon übermittelt' : 'Repository nicht erreichbar (' + r.status + ')');
}
async function relayGet(rl, rq) {
  const r = await fetch(ghUrl(rl.repo, rq.id), { headers: ghHead(rl.token), cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Repository nicht erreichbar (' + r.status + ')');
  const f = await r.json(); const j = JSON.parse(atob(String(f.content).replace(/\s/g, '')));
  return { sha: f.sha, s: JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(j.iv) }, await relayKey(rq.k, 'decrypt'), b64uDec(j.ct)))) };
}
const relayDel = (rl, rq, sha) => fetch(ghUrl(rl.repo, rq.id), { method: 'DELETE', headers: ghHead(rl.token), body: JSON.stringify({ message: 'abgeholt', sha }) });
async function packPayload(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream !== 'undefined') {
    try { return 'z' + b64uEnc(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); } catch (e) {}
  }
  return 'u' + b64uEnc(raw);
}
async function unpackPayload(str) {
  const bytes = b64uDec(str.slice(1));
  if (str[0] === 'z') {
    if (typeof DecompressionStream === 'undefined') throw new Error('Dieser Browser ist zu alt. Bitte iOS bzw. Chrome aktualisieren.');
    return JSON.parse(new TextDecoder().decode(new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
// Kurzer Prüfcode über die Abrechnungsdaten: steht im unterschriebenen PDF und lässt sich im Dashboard nachvollziehen
async function pruefcode(p) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify({ v: p.v, p: p.p, i: p.i, r: p.r })));
  const h = [...new Uint8Array(d)].slice(0, 4).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  return h.slice(0, 4) + '-' + h.slice(4);
}
function signPayload(x, R, to, rq) {
  const i = {}; Object.entries(x.inp).forEach(([k, v]) => { if (['notiz', 'signImg', 'signNote', 'datum'].includes(k) || v === '' || v == null || v === false) return; i[k] = v; });
  const D = CUR.core.DEFAULT_RULES, r = {}; Object.keys(D).forEach(k => { if (R[k] !== D[k]) r[k] = R[k]; });
  return { v: 1, p: CUR.id, i, r, ...(to ? { t: to } : {}), ...(rq ? { q: { i: rq.id, k: rq.k, r: rq.r, t: rq.t } } : {}) };
}

async function parseSigPdf(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const m = /HETECSIG:([A-Za-z0-9_-]+)/.exec(s);
  if (!m) throw new Error('keine Unterschrift im PDF gefunden');
  const o = JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
  if (!o || o.v !== 1 || !o.s || !o.m || !o.j || typeof o.i !== 'string' || !/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(o.i)) throw new Error('Unterschrift im PDF ist ungültig');
  return o;
}
